(거절·확인·허용)과 hooks 연결. 클로드가 무엇을 판단하든 **프로그램이** 지킵니다.`,when:`도구를 쓸 때마다`,commit:`커밋 ✓`},{id:`settings-local`,d:2,name:`settings.local.json`,cat:`enforce`,go:`commit`,desc:`나만의 설정. 클로드 코드가 처음 만들 때 내 컴퓨터의 전역 git 제외 목록에 넣습니다(손으로 만든 파일은 직접 빼야 합니다).`,when:`도구를 쓸 때마다`,commit:`빼기 ✗`},{id:`rules`,d:2,dir:!0,name:`rules/`,cat:`path`,go:`rules`,sub:`testing.md · api-design.md · frontend/react.md`,desc:"규칙을 주제별 파일로 나눈 것. `paths` 가 **없으면** CLAUDE.md 처럼 늘 읽고, **있으면** 그 경로의 파일을 만질 때만 읽습니다. 하위 폴더도 찾습니다.",when:`늘 / 경로가 맞을 때`,commit:`커밋 ✓`},{id:`skills`,d:2,dir:!0,name:`skills/`,cat:`invoke`,go:`skills`,sub:`security-review/ · deploy/ · release/`,desc:"스킬 하나 = 폴더 하나(`SKILL.md` + 딸린 파일). 처음엔 이름·설명만 읽고, `/이름` 으로 부르거나 클로드가 필요하다고 보면 본문을 펼칩니다.",when:`부를 때`,commit:`커밋 ✓`},{id:`agents`,d:2,dir:!0,name:`agents/`,cat:`isolate`,go:`agents`,sub:`code-reviewer.md · debugger.md · db-validator.md`,desc:`서브에이전트 정의. 저마다 자기 지시문·도구·모델·컨텍스트를 갖고 따로 일한 뒤 결과만 돌려줍니다.`,when:`일을 맡길 때`,commit:`커밋 ✓`},{id:`workflows`,d:2,dir:!0,name:`workflows/`,cat:`isolate`,go:`team`,sub:`release-train.js`,desc:"여러 서브에이전트를 스크립트 하나로 부리는 워크플로. 파일 하나가 `/이름` 명령 하나가 됩니다.",when:`부를 때`,commit:`커밋 ✓`},{id:`agent-memory`,d:2,dir:!0,name:`agent-memory/`,cat:`memory`,go:`memory`,sub:`debugger/MEMORY.md`,desc:"서브에이전트가 스스로 쌓는 기억(`memory: project` 일 때의 자리). 커밋해 팀과 나눌 수 있습니다.",when:`그 일꾼이 일할 때`,commit:`커밋 가능`},{id:`hooks`,d:2,dir:!0,name:`hooks/`,cat:`enforce`,go:`hooks`,sub:`format.sh · protect.sh`,desc:'hooks 가 부르는 스크립트를 모아 두는 곳(관례). 실제 연결은 `settings.json` 의 `"hooks"` 에서 합니다.',when:`정해 둔 순간마다`,commit:`커밋 ✓`},{id:`styles`,d:2,dir:!0,name:`output-styles/`,cat:`other`,sub:`review-mode.md`,desc:"클로드의 말투와 답하는 방식을 바꾸는 스타일. `/output-style 이름` 으로 고릅니다.",when:`고른 동안`,commit:`커밋 ✓`},{id:`docs`,d:1,dir:!0,name:`docs/`,cat:`other`,sub:`architecture.md · decisions/`,desc:"사람이 읽는 설계 문서. 클로드는 필요할 때 찾아 읽습니다. 꼭 읽혀야 하면 CLAUDE.md 에 `@docs/architecture.md` 로 가져옵니다.",when:`찾아 읽을 때`,commit:`커밋 ✓`},{id:`src`,d:1,dir:!0,name:`src/`,cat:`other`,desc:`소스 코드 폴더. 그 안
