 것`],[`**Electron** — 처음이라면 추천`,`거의 그대로`,`크다 (압축해도 100MB 안팎)`,`Node.js`],[`**Tauri**`,`거의 그대로`,`작다 (수 MB)`,`Rust + 빌드 도구 — 학교 PC 에서는 무겁다`],[`**Python** (pywebview · tkinter)`,`pywebview 는 그대로 · tkinter 는 화면을 새로`,`중간 (수십 MB)`,`파이썬 + PyInstaller`]],colw:[3.75,3,2.75,2.83],mark:[1],foot:{ico:`💬`,text:`어느 것을 고를지 직접 정하기보다, 계획 모드에서 먼저 물어보세요 — **「세 가지의 장단점을 표로 비교해 줘」**`},note:`Electron 은 VS Code 나 디스코드 같은 앱이 쓰는 방식이라 자료가 많고 클로드도 잘 압니다. 대신 결과물이 큽니다. Tauri 는 작고 빠르지만 Rust 와 빌드 도구를 깔아야 해서 학교 PC 에서는 부담스럽습니다. 어느 것을 고를지 직접 정하기보다 계획 모드에서 클로드에게 표로 비교해 달라고 하는 것부터가 연습입니다.`},{head:`학교 PC 에서 실제로 걸리는 세 곳`,vis:`cards`,cols:3,lead:`셋 다 앱이 잘못된 것이 아니라 학교 PC 와 보안 설정 때문에 생깁니다. 미리 알면 당황하지 않습니다.`,cards:[{ico:`🛡️`,t:`「Windows의 PC 보호」 경고`,b:`서명하지 않은 exe 를 열면 뜹니다. **추가 정보 → 실행**을 누르면 됩니다. 나눠 주기 전에 학생에게 미리 알려 두세요.`},{ico:`🧳`,t:`백신 · 관리자 권한`,b:`학교 PC 가 설치를 막을 수 있습니다. 설치 없이 폴더째 복사해 쓰는 **portable 판**으로 만드세요.`},{ico:`🔓`,t:`nodeIntegration: true`,b:`클로드가 이 설정을 제안하면 **왜 필요한지** 되물으세요. 화면 코드가 컴퓨터 파일에 바로 손대게 하는, 보안 장치를 끄는 설정입니다.`}],note:`세 가지 모두 실제로 자주 걸리는 곳입니다. 서명하지 않은 실행 파일의 경고는 앱이 잘못된 것이 아니라 인증서가 없어서 뜨는 것입니다. 학생에게 나눠 줄 때 미리 말해 두지 않으면 바이러스냐는 질문을 받습니다. nodeIntegration 은 화면 코드가 컴퓨터 파일에 바로 손댈 수 있게 하는 설정이라, 켜자고 하면 이유를 묻는 습관을 들이시면 좋습니다.`}],ask:[`quiz-app 을 복사한 quiz-desktop 폴더에서 작업합니다.`,`이 퀴즈 앱을 데스크톱 앱으로 만들고 싶어요.`,`아직 만들지 말고 계획만 세워 주세요.`,`- index.html·questions.js 는 최대한 그대로 두기`,`- 처음부터 전체 화면, Esc 로만 나가기`,`- 다 풀면 결과를 바탕 화면에 텍스트 파일로 저장`,`- 설치 없이 폴더를 복사해 실행하는 판으로 만들기`,`설치할 프로그램이 있으면 무엇을 왜 설치하는지 먼저 알려 주세요.`],check:[`인터넷을 끊고도 실행된다`,`다른 PC 에 폴더를 복사해도 실행된다`,`결과 파일이 바탕 화면에 실제로 생긴다`],askNote:`5교시처럼 계획 모드에서 이 요청을 보내고, 계획을 읽어 본 뒤 승인합니다. 마지막 줄 「무엇을 왜 설치하는지 먼저 알려 주세요」가 학교 PC 에서는 특히 중요합니다. 완성 확인 세 가지는 꼭 인터넷을 끊고, 다른 PC 에서 해 보세요.`},{key:`database`,t:`데이터베이스로 백엔드까지`,short:`DB 백엔드`,ico:`🗄️`,color:`#1D6FA3`,lv:3,folder:`quiz-server`,goal:`모둠별 점수가 쌓여 순위표가 뜨고, 교사는 관리 화면에서 문제를 고칩니다. 서버를 껐다 켜도 기록이 남아 있습니다.`,start:"5교시 `quiz-app` 을 복사한 **quiz-server** 폴더에서 시작합니다. 5교시 기획 메모에 「이번에는 안 할 것」으로 적었던 **순위 저장**을 이번에 합니다.",learn:`화면 · 서버 · DB 를 나누는 까닭 · 여러 사람이 한 데이터를 함께 쓰기 · 학생 기록을 어디에 두는가`,note:`두 번째는 데이터베이스입니다. 5교시 기획 메모에 「이번에는 안 할 것」으로 적었던 순위 저장을 이번에 합니다. 여러 사람이 한 데이터를 함께 쓰려면 화면과 데이터 사이에 서버가 필요하다는 것, 이것이 백엔드의 핵심입니다.`,hints:[{head:`코드보다 표 설계와 주소 목록을 먼저`,vis:`arch`,lead:`코드를 받기 전에 **표 설계와 주소(API) 목록**부터 받아 읽어 보세요. 방향이 틀렸으면 여기서 바로잡습니다.`,flow:[{ico:`🌐`,t:`화면`,sub:`브라우저 · 문제 보기, 답 내기`},{ico:`⚙️`,t:`서버`,sub:`API · 주소로 부탁을 받는다`},{ico:`🗄️`,t:`DB`,sub:`SQLite · 표에 줄을 쌓는다`}],both:!0,steps:[{t:`읽기`,d:`문제를 DB 에서 읽어 오기`},{t:`쓰기`,d:`다 풀면 결과 저장`},{t:`모으기`,d:`모둠별 순위표`},{t:`관리`,d:`교사용 문제 추가 · 수정 · 삭제`}],plan:[{t:`questions 표`,lines:[`번호 · 단원 · 문제 · 보기 1~4 · 정답 · 해설`]},{t:`results 표`,lines:[`번호 · 모둠 · 점수 · 푼 시각`]},{t:`주소 목록`,lines:["`GET /api/questions` — 문제 읽기","`POST /api/results` — 결과 저장","`GET /api/ranking` — 순위"]}],note:`코드를 받기 전에 표 설계와 주소 목록부터 받아서 읽어 보세요. 여기서 방향이 틀렸으면 코드 한 줄 버리지 않고 바로잡을 수 있습니다. 순서는 읽기, 쓰기, 모으기, 관리입니다. 지금 questions.js 에 있는 문제를 DB 로 옮겨 읽는 것부터 하면, 화면은 그대로인데 뒤가 바뀐 것을 확인할 수 있습니다.`},{head:`SQLite + 작은 서버`,vis:`pair`,lead:`처음에는 **SQLite + 작은 서버**를 권합니다. 모든 것이 교사 PC 한 대 안에서 끝납니다.`,pair:[{ico:`🗃️`,t:`SQLite + Node(Express) 또는 Python(Flask)`,rec:!0,b:[`파일 하나가 곧 DB — DB 서버를 따로 설치하지 않는다`,`교사 PC 한 대 안에서 모두 끝난다`,`DB 파일을 복사하면 그대로 백업`]},{ico:`☁️`,t:`클라우드 DB (Supabase · Firebase)`,rec:!1,b:[`학생 폰에서 어디서든 들어온다`,`키 관리 · 접근 규칙이 붙어 한 단계 더 어렵다`,`학생 기록이 바깥 서비스에 쌓인다 — 학교 규정 확인`]}],note:`SQLite 는 데이터베이스가 파일 하나라서 따로 DB 서버를 설치하지 않아도 됩니다. 수업용으로는 이것이 가장 가볍습니다. 학생 폰에서 어디서나 들어오게 하려면 클라우드 DB 가 필요하지만, 키 관리와 접근 규칙을 알아야 하고 학생 기록이 바깥 서비스에 쌓인다는 점도 생각해야 합니다.`},{head:`넷 가운데 첫째가 가장 중요하다`,vis:`cards`,cols:2,lead:`개인정보 규칙, 교실 네트워크, 보안, 파일 관리 — 서버를 직접 켜는 순간 생기는 일들입니다.`,cards:[{ico:`🔐`,t:`개인정보 규칙과 부딪힌다`,b:`5교시 CLAUDE.md 에 「학생 이름이나 점수를 저장하지 않는다」고 적었습니다. 지우지 말고 **「모둠 번호 · 별명만 저장」**으로 고쳐 쓰세요.`},{ico:`📶`,t:`학생 기기에서 접속`,b:"`localhost` 가 아니라 **교사 PC 의 IP 주소**로 엽니다. 방화벽 허용 창이 뜨고, 학교 무선망은 기기끼리 통신을 막아 둔 곳이 있어 미리 시험합니다."},{ico:`💉`,t:`SQL 인젝션`,b:`「SQL 문에 값을 직접 이어 붙인 곳이 없는지 점검해 줘」 — 이 한 줄로 막습니다.`},{ico:`🗂️`,t:`DB 파일 관리`,b:"DB 파일은 깃에 올리지 않습니다(`.gitignore`). 백업은 파일을 복사하면 됩니다."}],note:`첫 번째가 가장 중요합니다. 5교시 CLAUDE.md 에 학생 이름이나 점수를 저장하지 않는다고 적었는데, 이번 과제는 점수를 저장합니다. 규칙을 지우지 말고 모둠 번호와 별명만 저장하도록 고쳐 쓰세요. 클로드가 이 충돌을 먼저 알려 주는지 보는 것도 좋은 관찰거리입니다. 학교 무선망은 기기끼리 서로 못 보게 막아 둔 곳이 있어서, 수업 전에 학생 기기 하나로 꼭 미리 접속해 보셔야 합니다.`}],ask:[`quiz-app 을 복사한 quiz-server 폴더에서 작업합니다.`,`파일은 만들지 말고 계획만 세워 주세요.`,`- 문제를 questions.js 대신 SQLite 데이터베이스에서 읽기`,`- 다 풀면 모둠 번호와 점수를 저장하고 순위표 보여 주기`,`- 교사용 관리 화면에서 문제 추가·수정·삭제`,`- 학생 이름은 저장하지 않음`,`데이터베이스 표 설계와 서버 주소(API) 목록을 먼저 표로 보여 주세요.`,`CLAUDE.md 규칙과 부딪히는 것이 있으면 알려 주세요.`],check:[`브라우저 창 두 개로 동시에 제출해도 둘 다 남는다`,`서버를 껐다 켜도 순위가 남아 있다`,`관리 화면에서 고친 문제가 학생 화면에 나온다`],askNote:`요청 마지막 두 줄이 핵심입니다. 표 설계와 주소 목록을 표로 먼저 받고, CLAUDE.md 와 부딪히는 것을 알려 달라고 합니다. 완성 확인에서 브라우저 창 두 개로 동시에 제출해 보는 것은, 여러 사람이 함께 쓰는 상황을 혼자 흉내 내는 방법입니다.`},{key:`local-llm`,t:`로컬 LLM + 웹서버`,short:`로컬 LLM`,ico:`🦙`,color:`#7451B8`,lv:3,lvNote:`PC 사양에 따라 ★ 하나 더`,folder:`quiz-ai`,goal:`인터넷 없이, 교사 PC 안의 AI 가 단원 이름만 받아 4지선다 문제를 questions.js 형식으로 만들어 줍니다.`,start:"5교시 `quiz-app` 을 복사한 **quiz-ai** 폴더에서 시작합니다. Ollama 를 설치하고 모델을 하나 **미리** 내려받아 둡니다(수 GB).",learn:`AI 가 어디서 돌아가는가(회사 서버 ↔ 내 PC) · AI 를 부르는 서버 만들기 · AI 의 답을 사람이 검증하는 단계`,note:`세 번째는 로컬 LLM 입니다. 클로드나 챗GPT 는 회사의 서버에서 돌지만, 로컬 LLM 은 이 PC 안에서 돕니다. 그래서 인터넷 없이 되고, 학생 글이 밖으로 나가지 않고, 비용이 들지 않습니다. 대신 PC 사양에 따라 속도와 품질이 크게 갈려서 난이도가 하나 더 올라갈 수 있습니다.`,hints:[{head:`사양부터 보고, 첫 기능은 교사용으로`,vis:`spec`,lead:`로컬 LLM 은 PC 사양이 곧 성능입니다. **작업 관리자 → 성능**에서 메모리와 GPU 부터 보세요.`,table:[[`이 PC 의 메모리`,`알맞은 모델 크기`],[`8GB`,`3~4B`],[`16GB 이상`,`7~8B`],[`GPU 가 없으면`,`돌기는 하지만 글자가 천천히 나온다`]],tnote:`B = 매개변수 10억 개. 클수록 똑똑하지만 무겁습니다.`,why:[`단원 이름`,`AI 가 초안`,`교사 검토`,`questions.js`,`학생`],whyKey:2,whyText:`교사가 한 번 거르므로 AI 가 틀려도 학생에게 닿지 않습니다. 학생이 AI 와 직접 대화하는 기능은 그다음 — 학교의 AI 활용 지침도 함께 확인하세요.`,note:`시작 전에 작업 관리자에서 메모리부터 보세요. 메모리보다 큰 모델을 고르면 아예 안 돌거나 아주 느립니다. B 는 매개변수 10억 개라는 뜻이고, 숫자가 클수록 똑똑하지만 무겁습니다. 첫 기능을 교사용 문제 생성기로 권하는 까닭은, 교사가 한 번 걸러서 내보내므로 AI 가 틀린 문제를 만들어도 학생에게 닿지 않기 때문입니다.`},{head:`브라우저 → 우리 서버 → Ollama`,vis:`arch3`,lead:`브라우저가 Ollama 를 바로 부르지 않게 **사이에 우리 서버**를 둡니다. 프롬프트와 제한을 서버가 쥡니다.`,flow:[{ico:`🌐`,t:`브라우저`,sub:`교사 화면`},{ico:`⚙️`,t:`우리 서버`,sub:`프롬프트 · 길이 제한 · 줄 세우기`},{ico:`🦙`,t:`Ollama`,sub:"`localhost:11434` · 이 PC 안에서만"}],both:!1,cards:[{ico:`🦙`,t:`Ollama`,b:"설치한 뒤 `ollama run` 명령 한 줄이면 모델이 돕니다. API 는 `localhost:11434` 에 열립니다."},{ico:`🖱️`,t:`LM Studio`,b:`화면에서 모델을 골라 내려받고, API 서버도 단추로 켭니다.`},{ico:`🗣️`,t:`한국어 모델`,b:`Qwen · Gemma · EXAONE 계열. 라이선스는 내려받을 때 확인 (EXAONE 은 상업 이용 제한).`}],note:`Ollama 는 설치하고 명령 한 줄이면 모델이 돌아가고, 11434번 포트에 API 가 열립니다. 브라우저가 Ollama 를 바로 부르지 않고 사이에 우리 서버를 두는 것이 이 과제의 핵심 구조입니다. 시스템 프롬프트, 입력 길이 제한, 줄 세우기를 서버가 쥐어야 엉뚱한 요청이 들어와도 통제할 수 있습니다. 모델은 라이선스를 꼭 확인하세요.`},{head:`작은 모델과 PC 한 대로 교실을 감당할 때`,vis:`cards`,cols:2,lead:`클라우드 AI 에서는 신경 쓰지 않던 일들이 내 PC 에서는 그대로 드러납니다.`,cards:[{ico:`🧩`,t:`JSON 이 깨진다`,b:"작은 모델은 형식을 자주 틀립니다. Ollama 의 `format` 에 **JSON 스키마**를 넘기고, 서버에서 검사해 깨졌으면 다시 요청합니다."},{ico:`🐢`,t:`첫 응답이 느리다`,b:`모델을 메모리에 올리느라 수십 초 걸릴 수 있습니다. 「생각 중」 표시와, 글자가 하나씩 나오는 **스트리밍**을 넣습니다.`},{ico:`👥`,t:`30명이 동시에`,b:`PC 한 대로는 못 버팁니다. **한 번에 하나씩 줄 세우기.**`},{ico:`📦`,t:`모델 파일이 수 GB`,b:`학교망에서는 내려받기가 막히거나 오래 걸립니다. 집에서 **미리** 받아 오세요.`}],note:`작은 모델은 「JSON 으로만 답해」라고 해도 앞뒤에 말을 붙이거나 괄호를 빠뜨립니다. Ollama 에 JSON 스키마를 넘기면 형식을 강제할 수 있지만, 그래도 서버에서 한 번 더 검사하는 편이 안전합니다. 그리고 모델 파일이 수 GB 라서 연수장이나 학교에서 받으려면 시간이 오래 걸립니다. 미리 받아 오시길 권합니다.`}],ask:[`quiz-app 을 복사한 quiz-ai 폴더에서 작업합니다.`,`이 PC 에 Ollama 를 설치했고 [내려받은 모델 이름] 모델이 있습니다.`,`교사용 퀴즈 문제 생성기를 만들고 싶어요. 계획만 세워 주세요.`,`- 단원 이름과 문항 수를 넣으면 로컬 AI 가 4지선다 문제를 만듦`,`- 결과는 questions.js 와 같은 형식, 교사가 화면에서 고치고 지운 뒤 저장`,`- 브라우저는 우리 서버만 부르고, Ollama 는 서버가 부름`,`- 형식이 깨지면 다시 요청, 인터넷 없이 동작`],check:[`와이파이 · 랜선을 끊고도 문제가 만들어진다`,`「ㅋㅋㅋ」 같은 엉뚱한 단원을 넣어도 앱이 죽지 않는다`,`만든 문제가 퀴즈 앱에서 바로 열린다`],talk:`같은 단원으로 클로드가 만든 문제와 견주어 보세요. 어느 쪽에 사실 오류가 많은지, 왜 그런지 — 좋은 토의 거리가 됩니다.`,askNote:`완성 확인에서 일부러 엉뚱한 입력을 넣어 보는 것이 중요합니다. 학생은 반드시 그렇게 해 보기 때문입니다. 시간이 남으면 같은 단원으로 클로드가 만든 문제와 견주어 보세요. 어느 쪽에 사실 오류가 많은지, 왜 그런지 이야기 나누기 좋은 거리입니다.`}],n=[{ico:`📋`,t:`5교시 순서 그대로`,b:`기획 메모 네 줄(특히 **「이번에는 안 할 것」**) → CLAUDE.md → 계획 모드 → 작게 완성 → 학생 입장에서 확인
