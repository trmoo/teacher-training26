라 <b>어디에도 보내지도 저장하지도 않는</b> 것부터 정하고 만들었습니다.`},{key:`sheets`,name:`제출형 활동지`,icon:`🗂️`,color:`#2A7150`,threads:[`학번 + 비밀번호 2단계 로그인, 비밀번호는 **해시로만**`,`**가짜 시트 위에서 진짜 서버 코드**를 시험하고 미리 보기`,`교사 기능은 웹 대시보드가 아니라 **시트 메뉴로**`],lead:`구글 시트 + 앱스 스크립트로 만든 활동지입니다. 학생 답이 선생님 시트에 한 줄씩 쌓이고, 다른 학교 선생님은 <b>사본을 만들어</b> 자기 드라이브에서 씁니다.`},{key:`tools`,name:`교사·학급 도구`,icon:`🧰`,color:`#B23E6E`,threads:[`「공정한가」는 **실측으로** 답하기`,`**모르는 것은 말하지 않기** — 합격 가능성은 한마디도`,`남의 것에서 출발했으면 **이름을 함께** 적기`],lead:`수업 밖에서 담임과 진학 담당이 쓰는 도구입니다. 학생의 질문 「이거 공정해요?」에서 시작한 것도 있습니다.`},{key:`exam`,special:!0,kicker:`포털 밖 · 평가 사례`,name:`오프라인 수행평가`,icon:`🧾`,color:`#A6402A`,threads:[`평가 환경은 **교사가 통제**한다 — 시험지 파일이 어디에도 접속하지 못한다`,`연습용(D형)과 실전용(A·B·C형)은 **같은 틀, 다른 데이터**`,`안내문·문항지·감독 요령·유의사항까지 **한 벌로** 만들어 누가 감독해도 같은 조건`],lead:`「데이터 과학」 <b>[데이터 준비와 분석]</b> 수행평가를 <b>인터넷도 생성형 AI 도 없이</b> 치르려고, 문제지·답안지·데이터·파이썬 실행기를 <b>HTML 파일 하나</b>에 담아 실제로 운영했습니다. 실전 문항과 데이터가 들어 있어 포털에는 싣지 않았습니다.`,note:`여기부터는 포털에 없는 평가 사례입니다. 「AI 를 쓸 수 없는 평가를, AI 와 함께 만들었다」는 점을 먼저 말씀드리면 좋습니다. 실전 시험지는 공개하지 않고, 같은 틀의 연습용 D형만 공개했습니다.`}],d={"info-note":{badges:[`학습지 ①~㉒ 전체`,`파이썬 설치 없이 실행`,`정답값 자동 대조`,`파일 하나 · 더블클릭`],shots:[{cap:`**허프만 트리** — 빈도에서 코드표·압축률까지 (215비트 · 3.26)`},{cap:`조건 갈림길 확인기 — 실행되는 줄은 초록, 건너뛰는 줄은 빨강`},{cap:`네트워크 조립대 — 허브는 모든 포트로 뿌린다`}],base:[`고1 「정보」 수업에서 쓰는 제 학습지 **「정보 노트」(58쪽, ①~㉒)**를 화면으로 옮겼습니다.`,`괄호를 눈으로 읽고 끝내지 않고, **값을 바꿔 실행해 보며** 채우게 하고 싶었습니다.`,"주소(`#data/radix`)로 화면을 바로 건넬 수 있어 수업 중 「이 화면 여세요」가 쉽습니다."],care:[`**학습지 정답과 수치를 전부 대조**했습니다 — 허프만 a=1111·b=0 / 215비트 / 압축률 3.26, 정렬 비교 15·15·10.`,`런렝스 압축이 **오히려 커지는 경우**까지 보여 줍니다. 잘 되는 예만 보면 오개념이 생깁니다.`,`파이썬은 직접 만든 해석기로 **설치 없이** 돌고, 빈칸 코드·도전 과제를 실행 결과까지 자동 채점합니다.`,`괄호 정답은 가려 두고 [보기]로, 교사는 [👁️ 정답 모두 보기]로 한 화면을 통째로 엽니다.`],effect:[`허브와 스위치의 차이처럼 **말로만 하던 동작을 눈으로** 확인합니다.`,`빈도를 고쳐 보며 허프만 코드표와 압축률을 직접 구하고 런렝스와 견줍니다.`,`종이 학습지와 화면이 1:1 이라, 정리는 종이로 · 확인은 화면으로 이어집니다.`],claude:[`빈칸 코드의 기대 출력을 **손으로 계산해 적었다가 실제 실행 값과 달랐습니다**(2.4285… ↔ 2.2142…). 그 뒤 기대값은 반드시 실행해서 얻습니다.`,`저작권 문구를 바꾸고 배포 점검의 검사 글자를 안 고쳐 **배포가 한 번 실패**했습니다. 「두 곳을 함께 고칠 것」이 규칙이 되었습니다.`],lesson:`정답값은 손으로 셈하지 말고 실행해서 얻고, 그 값을 시험으로 고정합니다.`,note:`허프만 쪽에서 「종이 학습지의 215비트·3.26 이 앱과 완전히 같다」는 점을 말하면 정답 대조의 가치가 전해집니다. 네트워크 쪽은 허브 → 데이터 보내기를 눌러 모든 포트로 퍼지는 공을 짚어 주세요.`},"ai-note":{badges:[`학습지 36쪽 · 화면 23개`,`정답 98가지 자동 대조`,`진짜 계산(신경망 학습)`,`외부 라이브러리 0`],shots:[{cap:`**퍼셉트론** — XOR 은 직선 하나로 갈리지 않는다`},{cap:`합성곱 연산기 — 필터를 한 칸씩 굴려 6×6 특징맵`},{cap:`8-퍼즐 네 탐색의 「살펴본 상태 수」 — BFS 23 vs A* 5`}],base:[`고2 「인공지능 기초」 제 학습지(36쪽)가 「빈칸을 채우는 종이」라면, 이 앱은 **그 빈칸의 값을 직접 만들어 보는 실험실**입니다.`,`예: 「분산 = ( )」 칸 앞에서 자료의 숫자를 바꿔 분산이 어떻게 움직이는지 보고 나서 채웁니다.`],care:[`흉내가 아니라 **진짜 계산** — 2-4-1 신경망이 역전파 3,000회로 XOR 을 스스로 배우고, 8-퍼즐을 네 탐색으로 정말 풉니다.`,`학습지 정답 98가지를 시험으로 지킵니다(분산 70/9, 정밀도 60%·재현율 75%, 강 건너기 최소 7번).`,`원본이 그림이라 읽을 수 없던 곳은 **몰래 채우지 않고** 대체한 사실을 밝혔습니다.`,`모럴 머신 13상황은 「정답 없는 토의용」이라고 화면에 적었습니다.`],effect:[`퍼셉트론이 XOR 을 못 가르는 것을 직접 확인하고, 다층 신경망이 두 직선으로 가르는 데까지 이어 봅니다.`,`휴리스틱이 탐색 비용을 줄이는 것을 **숫자로** 확인합니다.`,`임계값을 움직이며 정밀도와 재현율이 맞바뀌는 것을 체험합니다.`],claude:[`정답 계산과 대조하다 **제 학습지 8쪽 표의 정밀도·재현율 설명이 서로 바뀌어** 있는 것을 찾았습니다. 앱은 채점 정답인 9쪽을 따르고, 종이 학습지를 고치라고 기록했습니다.`,`읽을 수 없는 격자 그림은 지어내지 않고, 정답에 적힌 값과 앞뒤가 모두 맞는 배치를 찾아 넣었습니다.`],lesson:`내가 만든 학습지도 정답 대조 시험을 붙이면 오류가 드러납니다.`,note:`퍼셉트론 쪽에서 XOR 을 눌러 보이는 것이 가장 짧고 강합니다. 학습지 오류를 정답 대조로 찾았다는 이야기는 「시험을 먼저 만든다」의 좋은 사례입니다.`},"prog-textbook":{badges:[`3단원 38차시`,`확인 문제 227`,`파이썬 브라우저 실행`,`빌드 6단계 관문`],shots:[{cap:`[실행]하면 **파이썬이 브라우저에서 돌고** 확인된 출력과 견준다`},{cap:`붙여넣기가 막힌 코드 작성 실습 — 손으로 쳐 보게 하는 장치`},{cap:`목차 — 3단원 38차시, 위쪽 단추로 Python ↔ C 전환`}],base:["「프로그래밍」은 NCS 기반 전문 교과 기초 과목이라 정보과 성취기준 목록에 **없습니다.** 운영 계획서에서 성취기준 14개(`프그01-01`~)를 찾아 뼈대로 삼았습니다.",`3단원 38차시를 새로 썼고, 마지막 9차시는 「반 성적 정리 프로그램」 하나를 기획 → 설계 → 구현 → 테스트까지 관통합니다.`],care:[`파이썬은 브라우저에서 **실제로 실행**됩니다. 엔진은 첫 [실행]을 누를 때까지 받지 않고, 막혀도 「확인된 실행 결과」가 보여 본문 학습은 이어집니다.`,`C 는 일부러 브라우저에서 돌리지 않습니다 — 가벼운 해석기는 한글을 못 찍고 컴파일러는 학교망에 너무 큽니다. 대신 **실제로 컴파일해 확인한 출력**을 실었습니다.`,`코드 작성 칸은 붙여넣기를 막았습니다 — 부정행위 방지가 아니라 **손으로 쳐 보게 하는 학습 장치**라고 설명합니다.`,`빌드가 예제를 실제로 돌려 보고, 하나라도 다르면 사이트가 아예 만들어지지 않습니다.`],effect:[`「예상 → 실행 → 대조」로 값을 바꿔 가며 손에 남는 문법을 만듭니다.`,`같은 문제를 Python 과 C 로 견주며 문법보다 **문제 해결 구조**에 집중합니다.`,`3단원에서 개발 절차 전체를 프로그램 하나로 겪어 봅니다.`],claude:[`본문 형식(MDX)이 예제의 **들여쓰기를 2칸씩 몰래 지워**, 검증한 코드와 학생이 복사하는 코드가 달라지는 사고가 있었습니다. 지금은 빌드가 글자 단위로 대조합니다.`,"성취기준 코드를 못 찾아 「잠정」 코드를 쓰다가 근거를 찾은 뒤 모두 바꿨습니다. `12프로…` 같은 코드를 **지어내지 말 것**을 규칙에 적었습니다."],lesson:`검증은 학생이 실제로 보는 결과물에 대고 해야 합니다.`,note:`[실행]으로 「파이썬을 설치하지 않았는데 돌아간다」를 보이고, 「C 는 일부러 안 돌린다」는 판단의 이유(한글 출력·용량)를 함께 말하면 「교실 현실이 기술 결정을 이긴」 사례가 됩니다. 붙여넣기 차단은 학습 장치라는 점을 분명히 해 주세요.`},commeng:{badges:[`10차시 · 40화면`,`시뮬레이터 9개`,`실제 시스템 안 건드림`,`자동 시험 2,061가지`],shots:[{cap:"**확장자 보이기**를 켜자 `사진.jpg` 가 `사진.jpg.exe` 로 드러난다"},{cap:`가짜 탐색기 — 같은 이름 파일 두 개, 경로가 달라야 구분된다`},{cap:`작업관리자 시뮬레이터 — 「디스크 100%」 시나리오의 원인 찾기`}],base:[`중·고등학생이 **컴퓨터를 처음 제대로 배우는 10차시**(교과·창체·방과후)를 위해 만들었습니다.`,`학교 PC 는 권한이 막혀 있고, 파일 삭제·네트워크 설정을 진짜로 연습하면 사고가 납니다.`,`「장애 대처」는 8차시에 두었습니다 — 메모리·디스크·네트워크를 모르면 증상만 외우게 되니까요.`],care:[`가장 중요한 원칙은 **실제 시스템을 건드리지 않는 것** — 바탕 화면·탐색기·작업관리자·Wi-Fi 등 시뮬레이터 9개를 화면 안에 만들었습니다.`,"3차시 **위장 확장자** — 윈도우 기본값에서 `사진.jpg` 이던 파일이 「보이기」를 켜면 `사진.jpg.exe` 로 드러납니다.",`체크리스트는 학생이 탐색기에서 **실제로 해야만** 켜집니다(뒤로·정렬·검색을 앱이 알아챔).`,`1차시 진단 30문항을 10차시에 다시 풀어 성장을 잽니다. 그래서 1차시엔 **일부러 정답을 보여 주지 않습니다.**`],effect:[`경로를 직접 쓰고, 확장자로 위험한 파일을 가려내고, ipconfig 결과를 읽어 원인을 짚습니다.`,`「왜 느린가 · 왜 안 되는가」를 증상 암기가 아니라 **원리로** 설명합니다.`,`실제 PC 에서는 위험한 일을 **안전하게 실패해** 봅니다.`],claude:[`고르기 단추가 첫 항목을 미리 골라 두어, **아무것도 안 고르고 [확인]을 눌러도 정답**이 되던 것을 잡았습니다.`,`글 다듬기 1번은 잘랐다 되돌리면 처음과 같아져 **손대지 않아도 통과**했습니다. 이제 시험이 「시작 = 목표」인 문제를 막습니다.`],lesson:`채점은 「맞혔나」만이 아니라 「안 풀어도 맞게 되지 않나」까지 시험해야 합니다.`,note:"1번 화면에서 스위치 하나로 `사진.jpg` 가 `사진.jpg.exe` 로 바뀌는 순간을 보여 주세요. 「실제 PC 에서 하기 어려운 연습을 시뮬레이터가 대신한다」가 핵심입니다."},physical:{badges:[`보드 8 × 부품 50`,`400조합 전수 시험`,`전원 V·A 자동 계산`,`[12정01-03] · [12소생02-02]`],shots:[{cap:`보드를 고르면 부품마다 **🟢 🟡 🔴 판정**이 자동으로 붙는다`},{cap:`초음파 센서 + ESP32 — 🟡 조건부 판정과 해결 방법, 보드 8종 비교`},{cap:`전원 계산 — 「우노는 USB, 서보·네오픽셀만 따로 5V 3A」`}],base:[`프로젝트를 준비하는 학생의 질문 — 「이 보드에 이 센서 붙여도 돼요?」 「전원은 몇 V 몇 A 예요?」`,`두 성취기준의 핵심 동사가 모두 **「선택」**이라, 보드를 고르고 → 부품을 담고 → 전원·핀을 검사받는 흐름을 화면으로 옮겼습니다.`],care:[`판정 엔진이 **신호 전압이 공급 전압을 따라가는가**까지 봐서, 같은 5V 부품이라도 초음파는 🟡 · PIR 은 🟢 로 갈립니다.`,`「🔴 안 됨」에는 **반드시 해결 방법**을 붙입니다 — 정말 못 쓰는 경우는 드물고 대부분 「부품 하나 더」면 되니까요. 시험이 검사합니다.`,`서보·네오픽셀처럼 힘을 쓰는 부품은 외부 전원으로 따로 빼는 **현실적인 답**을 냅니다.`,`보드 이름 뒤 조사(마이크로비트**가** · ESP8266**이**)까지 자동으로 맞춥니다.`],effect:[`전압·전류·핀 수·I2C 주소를 근거로 **고르고, 그 이유를 말합니다.**`,`사기 전에 「이 구성이면 몇 V 몇 A」를 계산 과정과 함께 확인하고 부품표로 만듭니다.`,`「안 됨」을 「어떻게 하면 됨」으로 바꿔 생각합니다(분압 저항 · 레벨 시프터).`],claude:[`부품 표에는 「서보: 5V 핀」, 아래 전원 계산은 「외부 전원」 — **두 곳이 다른 함수를 써서 어긋났습니다.** 배정을 한 곳에서만 정하게 고쳤습니다.`,`시험이 화면 파일을 부르지 않아 **괄호 하나 빠진 채 시험은 통과하고 빌드에서야** 터졌습니다. 그 뒤 문법 전수 검사를 배포 단계에 넣었습니다.`],lesson:`시험이 「무엇을 보지 않는지」도 알아 둬야 합니다.`,note:`마이크로비트로 「소리」 갈래를 열어 🔴 와 해결 방법을 함께 보여 주세요. 전원 계산의 「우노는 USB, 서보·네오픽셀은 따로 5V 3A」는 실제 수업의 정답과 같은 모양입니다.`},"computer-spec":{badges:[`화면 22 · 문항 74`,`2026 최신 사양`,`활동지 파일 내려받기`,`[12정01-03]`],shots:[{cap:"**CPU 모델명 해부기** — `Core Ultra 7 258V` 를 조각조각 풀이"},{cap:`해상도 실험실 — 실제 픽셀 수로 그린 화면을 확대해 비교`},{cap:`종합 미션 — 내 기준 점수 순으로 노트북 비교, ⚠ 는 조건과 어긋난 곳`}],base:[`학습지 「[정보] 나에게 쏙 맞는 노트북 선정하기」(2쪽)에서 출발했습니다.`,`학습지의 사양 내용이 낡아 **2026년 기준으로 바꾸기로** 했습니다 — Core Ultra · Ryzen AI · Snapdragon X · Copilot+.`,`성취기준 [12정01-03] 의 「적합한 장치 **선택**」과 이었습니다.`],care:[`**CPU 모델명 해부기** — 이름을 브랜드·등급·시리즈·번호·접미사로 쪼개 풀어 줍니다. 모르는 형식은 억지로 풀지 않습니다.`,`**해상도 실험실** — 실제 픽셀 수로 그린 화면을 확대해 HD·FHD·4K 와 윈도우 배율 차이를 눈으로 봅니다.`,`가상 노트북 6대(이름·가격은 지어낸 것)를 **내가 정한 기준 순위**로 점수 매깁니다.`,`학번·이름은 내려받는 활동지 파일에만 들어가고, 브라우저에는 남지 않습니다(시험이 막음).`],effect:[`광고 문구가 아니라 **사양표를 읽고 의미를 설명**합니다.`,`기준에 순위를 매겨 하나를 고르고, **「포기한 것」과 그 까닭**까지 씁니다.`,`「싸다 ≠ 내게 맞다」, 「ARM 은 배터리가 길지만 안 되는 프로그램이 있다」 같은 함정을 따져 봅니다.`],claude:[`클로드가 쓴 사양 사실(코어·스레드, 접미사, USB 속도)을 **다른 도우미로 한 번 더 대조**해 틀린 곳을 고쳤습니다.`,`화면에 「null」 글자가 찍히는 같은 실수를 **두 번** 겪고, 그 뒤로 검사가 그 모양의 코드를 막습니다.`],lesson:`자주 바뀌는 사실은 만든 AI 와 다른 눈으로 다시 확인합니다.`,note:"해부기에 선생님 노트북의 CPU 이름을 직접 넣어 보게 하세요. 무심코 보던 `V`·`HX`·`U` 접미사가 풀이되는 순간 반응이 좋습니다."},api:{badges:[`나이스 급식 API`,`🌐 실제 ↔ 📦 연습 모드`,`[12정02-03] · [12데과02-01]`,`자동 시험 332가지`],shots:[{cap:`**JSON 탐험기** — 값을 누르면 꺼내는 경로가 JS·파이썬 두 문법으로`},{cap:`주소 해부기 — 프로토콜·호스트·경로·파라미터를 색으로 가른다`},{cap:`나이스 급식 API — 학교 코드로 부른 식단과 알레르기 번호`}],base:[`두 성취기준의 핵심 동사가 **「수집」**입니다. 주소를 부르면 자료(JSON)가 오는 것을 직접 해 보게 했습니다.`,`학생에게 가장 가까운 데이터 — **우리 학교 급식**을 나이스 API 로 불러옵니다.`,`「어렵다」는 의견에, 숫자 하나만 바꾸면 결과가 통째로 바뀌는 가장 쉬운 화면을 2번 자리에 넣었습니다.`],care:[`교실 인터넷이 끊기면 수업이 멈추므로 **📦 연습 모드**를 두었습니다. 받아 둔 진짜 응답으로 **5건 제한과 오류 코드까지 똑같이** 재현합니다.`,`「**HTTP 200 이라고 자료가 있는 건 아니다**」 — 자료가 없어도 200 을 주는 나이스의 응답을 가장 크게 가르칩니다.`,"한글이 `%EC%99%80` 로 바뀌는 과정을 한 글자씩 보여 줍니다.",`브라우저에서 막히는 API 는 [진짜로 불러 보기]로 막히는 것을 직접 겪게 한 뒤 까닭(CORS)을 가르칩니다.`],effect:[`주소의 구조를 읽고, 파라미터 하나가 응답을 어떻게 바꾸는지 설명합니다.`,`JSON 에서 필요한 값을 꺼내는 경로를 쓰고, 알레르기 번호 풀이 같은 **전처리**로 이어 갑니다.`,`인증키·5건 제한 같은 **현실의 제약**을 이해합니다.`],claude:[`요청에 헤더 한 줄을 붙였더니 나이스가 허용 헤더를 안 보내 **브라우저에서만** 막혔습니다. 명령 창에서는 되어 찾기 어려웠습니다.`,`조사 단계에서 「나이스는 호출 제한이 없다」는 단정이 **검증 단계에서 뒤집혔고**, 인용했던 수치 둘도 다른 API 의 값이었습니다.`],lesson:`AI 가 조사해 온 사실은 검증 단계를 따로 둬야 합니다.`,note:'캡처는 📦 연습 모드입니다. JSON 에서 `26.2` 를 누르면 `데이터["current"]["temperature_2m"]` 이 적히는 장면이 요점입니다. 「제한 없음」 단정이 뒤집힌 일화를 덧붙이세요.'},pydataset:{badges:[`데이터셋 757개`,`컬럼 이름 · 초성 검색`,`그래프별 맷플롯립 코드`,`데이터 값은 싣지 않음`],shots:[{cap:`**자세히 보기** — 컬럼 표(종류·빠진 값)와 그래프별 맷플롯립 코드`},{cap:"이름이 겹치는 `lung` — `data('lung')` 로는 부를 수 없다는 경고"},{cap:`주제별 보기 — 757개를 열 갈래로`}],base:[`맷플롯립 1차시에서 그래프 네 가지를 배운 학생들이 **「이제 무슨 데이터로 그려 보지?」**에서 막혔습니다.`,`파이썬 PyDataset 패키지의 연습용 데이터 757개를 갈래 10 · 소분류 43으로 묶고, 한국어 제목 757개를 새로 썼습니다.`],care:["이름·한국어 제목·**컬럼 이름**·**초성**(`ㅂㄲ` → 붓꽃)으로 찾고, 그리고 싶은 그래프를 먼저 고르면 **그릴 수 있는 자료만** 남깁니다.",`자세히 보기에 컬럼 표(종류·다른 값·빠진 값)와 그래프마다 바로 쓰는 코드가 나옵니다.`,`데이터 값은 담지 않습니다 — 자료마다 이용 조건이 달라, 학생이 코랩에서 직접 부르게 했습니다.`],effect:[`「쓸 자료가 없다」에서 벗어나 **내 관심사에서 출발해 탐구 질문**을 세웁니다.`,`컬럼 종류와 빠진 값을 먼저 읽고 맞는 그래프를 판단하는 습관을 기릅니다.`,`같은 이름이라도 다른 자료일 수 있음을 알고 **출처를 확인**합니다.`],claude:[`패키지를 실제로 설치해 대조하다 **이름이 겹치는 30쌍은 한쪽을 부를 수 없다**는 것을 찾았습니다. 757개인데 부를 수 있는 이름은 727개, 13개는 파일까지 잘못 담겨 있었습니다.`,`이 발견을 숨기지 않고 「안내」 탭과 해당 카드에 ⚠ 로 실었습니다.`],lesson:`도감을 만들 때는 문서를 믿지 말고 실제로 불러 봅니다 — 패키지의 결함까지 나옵니다.`,note:"`lung` 카드(⚠)를 열어 「AI 와 만든 도감이 패키지 자체의 결함을 찾았다」는 이야기를 해 주세요. 문서와 파일을 실제로 맞대어 본 결과라는 점이 중요합니다."},seaborn:{badges:[`예제 데이터 22개`,`그래프 함수 21가지`,`코드 333개 실제 실행 검사`,`맷플롯립 ↔ 씨본`],shots:[{cap:`**맷플롯립 7줄 ↔ 씨본 1줄** — 같은 회귀선 그래프를 두 방식으로 나란히`},{cap:`그래프 함수 고르기 — 함수마다 지어낸 숫자로 그린 「모양 그림」 카드`},{cap:`데이터 자세히 — 컬럼의 한국어 뜻과 「불러올 때 조금 손질합니다」 알림`}],base:[`PyDataset 도감의 짝 — 맷플롯립 1차시 **다음 걸음**으로 씨본을 소개하려고 만들었습니다.`,`757개에 씨본 코드를 붙이는 대신, 씨본이 직접 내장한 **예제 데이터 22개 + 그래프 함수 21가지**로 범위를 좁혔습니다.`],care:[`**맷플롯립 ↔ 씨본** — 같은 그래프 7쌍을 나란히 놓고 줄 수를 견줍니다. 씨본이 대신해 주는 일(셈·나누기·색칠)이 눈에 보입니다.`,`앱에 실린 코드 **333개를 진짜 파이썬으로 모두 실행**해 봅니다. 오류는 물론, 학생 화면에 경고 한 줄만 떠도 실패로 칩니다.`,`컬럼마다 한국어 뜻을 붙이고, 「이 자료로 던져 볼 물음」을 주되 답은 주장하지 않습니다.`],effect:[`「어떤 자료로 어떤 그래프가 되나」를 자료 쪽에서도, 그래프 쪽에서도 찾으며 **짝짓는 판단력**이 생깁니다.`,`같은 그래프를 두 도구로 견주며 도구를 고르는 기준을 압니다.`,"`hue=`·`col=` 한 단어로 무리를 나누는 코드를 읽고 고쳐 씁니다."],claude:[`geyser 자료의 분류 기준을 「분출 길이」라고 적었는데, **실제로 재 보니 「기다린 시간」으로 나눈 것**이었습니다. 그 뒤로 설명 속 사실은 도구가 직접 재서 싣습니다.`,"`sns.set_theme()` 이 한글 글꼴을 풀어 버린다, 불러오는 방법에 따라 요일 차례가 달라진다 — 만들며 알아낸 것이 「함정 8가지」가 되었습니다."],lesson:`설명은 AI 가 그럴듯하게 쓰지만, 값은 실제로 재서 싣습니다.`,note:`「코드가 안 돌면 학생 앞에서 곤란하다」는 걱정을 겨냥한 앱입니다. 앱 속 코드 333개를 모두 실제로 돌려 확인했다는 점을 강조합니다. 1번 화면에서 7줄과 1줄을 나란히 보여 주세요.`},pandas:{badges:[`단원 7 · 레슨 23`,`pandas 2.2 와 글자 대조`,`설치 · 인터넷 없이`,`자동 시험 1,891가지`],shots:[{cap:`**groupby** — 쪼개기 → 계산 → 합치기 세 걸음을 색으로 보는 👀 패널`},{cap:`**loc·iloc** — 고른 칸이 표에 노랗게 칠해진다`},{cap:`빅데이터분석기사 대비 치트시트 87조각 (앱 · HTML · A4 PDF 한 원본)`}],base:[`판다스 수업에서 학생들이 **코랩 접속·설치에서 시간을 버리고**, 같은 명령에서 같은 실수를 되풀이했습니다.`,`강의 자료와 제 수업 필기는 **진도와 「자주 틀리는 포인트」만** 참고하고, 예제·데이터(별빛 분식·한빛시 공유자전거)·문제는 모두 새로 만들었습니다.`,`기초부터 빅데이터분석기사 작업형1 꼴 미션과 치트시트까지 이어집니다.`],care:[`판다스 명령을 흉내 내는 **자체 엔진**을 만들고, 모든 셀의 출력을 **진짜 pandas 2.2 와 글자 단위로** 대조했습니다.`,`빈칸은 「결과가 정답과 같으면」 통과 — 다르게 써도 맞게 해 줍니다.`,`**👀 그림 패널** — loc·iloc 로 고른 칸이 칠해지고, groupby 의 세 걸음이 색으로 보입니다.`,`🤔 결과 예측 셀 — 실행하기 전에 결과를 먼저 고르게 합니다.`],effect:[`불러오기 → 골라내기 → 고치기 → 요약하기 → 합치기까지 **판다스 한 바퀴**를 직접 코드로 칩니다.`,`결과를 먼저 예측하고 확인하며 코드를 **읽는 눈**이 길러집니다.`,`실기 시험 꼴의 문제를 시간 압박 없이 되풀이해 풀어 봅니다.`],claude:["**제 수업 필기의 「추천 방법」 하나(`df.iloc[i, '열이름']`)가 진짜 파이썬에서는 오류**라는 것을 실행해 보고 알았습니다. 레슨에서 함정으로 다룹니다.",`같은 값끼리의 정렬 차례는 **진짜 판다스도 컴퓨터마다 달랐습니다.** 레슨은 동점 없는 열로 정렬하고 그 사실을 화면에 밝혔습니다.`],lesson:`「기준이 되는 진짜」 출력을 먼저 만들어 두면, AI 가 만든 엔진도 내 필기도 기계가 채점합니다.`,note:`「파이썬을 깔지 않아도 판다스 수업이 된다」가 핵심입니다. 제 필기가 틀렸던 일화는 「AI 가 만든 것도, 내가 쓴 것도 실행해서 확인해야 한다」로 이어 말하기 좋습니다.`},penguins:{badges:[`코랩 노트북 4개를 브라우저로`,`코랩과 같은 출력`,`힌트 3단계`,`자동 시험 707가지`],shots:[{cap:`빈칸을 채워 실행하면 상자그림이 나온다 — 코랩과 같은 출력`},{cap:`**IQR 울타리 실험실** — 열을 바꾸면 Q1·Q3·울타리와 이상치가 한눈에`},{cap:`정규화 계산기 — 펭귄 한 마리를 따라가며 공식을 계산`}],base:[`다른 선생님의 코랩 노트북 4개(수집·특성 → 결측치 → 이상치 → 정규화)의 **빈칸 명령어 실습**을 브라우저에서 그대로 하게 했습니다.`,`명령어 순서와 빈칸 자리만 따르고, 설명·힌트·확인 문제·「눈으로 보기」는 새로 썼습니다.`,`교실에서 코랩 로그인과 인터넷에 기대지 않고 같은 실습을 하려는 것이 목적입니다.`],care:[`출력이 **코랩과 글자 하나까지 같게** — 진짜 pandas 로 100셀을 돌린 기준과 대조합니다.`,`채점은 정답 코드를 처음부터 실행한 결과와 견줍니다. 출력과 **모든 변수 값**이 같으면 통과라 다르게 써도 맞습니다.`,`힌트 3단계(설명 → 첫 글자 무늬 → 정답 넣기), 코랩 모양의 오류 화면에 우리말 도움말을 붙였습니다.`],effect:[`상자그림·IQR 로 이상치를 찾고, 결측치를 채우고, 정규화하는 과정을 **직접 명령어를 쳐서** 실행합니다.`,`「150행 → 148행」 같은 결과 숫자를 읽고 왜 그런지 설명합니다.`,`틀린 채로 실행하면 표가 이미 바뀌어 있는 함정 등, 코랩에서 겪을 일을 미리 겪습니다.`],claude:["채점이 「대입한 변수」만 비교하던 때는, 대입 없이 표를 바꾸는 `fillna(inplace=True)` 에 **엉뚱한 값을 넣어도 통과**했습니다. 모든 변수를 견주게 고쳤습니다.",`평균의 마지막 자리가 계속 어긋났는데, numpy 가 수를 더하는 **순서까지 흉내 내자** 맞았습니다.`],lesson:`「거의 같음」에서 멈추지 않고, 대조 시험이 통과할 때까지 밀고 갑니다.`,note:`다른 선생님의 노트북에서 출발한 자료라 작성자 이름은 말하지 않습니다(저작자 표시를 하지 않기로 함). 「노트북을 앱으로 옮기면 빈칸 → 실행 → 자동 채점이 된다」를 강조합니다.`},regression:{badges:[`학습지 3쪽 → 화면 9개`,`직선을 손으로 긋기`,`저장 파일로 이어 하기`,`정답 보기 없음`],shots:[{cap:`**손잡이로 직선을 긋고** 오차² 정사각형을 본다 (오차 제곱합 67.0 vs 최소 65.9)`},{cap:`결정 계수 — 막대 세 걸음으로 226 = 160.1 + 65.9, R² ≈ 0.71`},{cap:`통계적 회귀와 기계학습 회귀 — 학습·평가 데이터 나누기`}],base:[`「데이터 과학」 회귀 분석 학습지(3쪽)를 화면 9개로 옮겼습니다. 원칙은 **「학습지 내용을 벗어나지 않는다」**.`,`광고비·매출액 9개월 자료로 최소제곱법 · 상관계수 · MAE·MSE · 결정 계수까지 갑니다.`],care:[`손잡이 두 개로 **직선을 직접 그으면** 예측값·오차·오차² 표와 오차 정사각형이 실시간으로 바뀌고, 최소제곱 65.9 와 견줍니다.`,`「오차의 합 vs 제곱합」 — 평균 수평선은 오차의 합이 0 인데 제곱합은 226. **왜 제곱해야 공정한지** 숫자로 보입니다.`,`**정답 보기 단추를 일부러 뺐습니다.** 힌트만 두고, 계산기로 직접 채우는 칸을 남겼습니다.`,`[💾 저장하기]는 앱 파일에 활동을 심어 바탕 화면에 저장합니다. 다음 시간에 그 파일을 열면 이어서 합니다.`],effect:[`「가장 잘 맞는 직선」이 **오차 제곱합이 가장 작은 직선**이라는 것을 손으로 체험합니다.`,`결정 계수가 「평균으로 짐작할 때보다 얼마나 줄었나」라는 뜻임을 이해합니다.`,`학습·평가 데이터를 나누는 까닭을 알고 두 가지 회귀를 구별합니다.`],claude:[`**저장 방식이 네 번 바뀌었습니다**(PDF → 활동지 파일 → … → 지금). 마지막 계기는 「학습지를 저장하는 것처럼 보인다」는 제 한마디였습니다.`,`표는 반올림해 보여 주되 **합계는 반올림 전 값으로** 셉니다 — 아니면 65.9 보다 작은 값이 나올 수 있었습니다.`],lesson:`단추 하나, 말 한마디가 설계를 바꿉니다. 써 보고 어색하면 바로 말합니다.`,note:`1번 캡처는 손잡이를 끌어 y = 1.50x − 0.50 직선을 그은 상태입니다(오차 제곱합 67.0). 「정답 보기를 뺀 이유」를 짚으면 AI 가 만든 앱을 교사가 교육적으로 다듬는 과정이 보입니다.`},"apps-script":{badges:[`STEP 0~13`,`실습 프로젝트 4종`,`기술부채 vs 이해부채`,`[12정03-09] · [12정03-10]`],shots:[{cap:`**개발 7단계마다 「AI 에게 맡길 수 있나」** — 구현은 ⭕, 문제 정의·배포·회고는 ❌`},{cap:`기술부채와 이해부채 — 「잘 되고 있다」는 착각을 짚는다`},{cap:`AI 에게 묻는 법 — 「코드 짜 줘」 대신 환경·데이터 구조·조건을 갖춘 질문`}],base:[`「정보」 2~3차시에 구글 시트 + 앱스 스크립트로 **휴대폰에서 열리는 웹앱 하나를 배포까지** 만들어 봅니다.`,`겨냥한 것은 문법이 아니라 **개발 7단계를 한 바퀴 도는 경험**과 「어느 단계를 AI 에게 맡길 수 있나」를 **판단하는 힘**입니다.`],care:[`7단계 표에 **「AI 에게 맡길 수 있나」** 열을 달았습니다 — 구현은 ⭕(가장 잘하는 구간), 문제 정의·배포·회고는 ❌(내 몫).`,`**「기술부채 vs 이해부채」** — 바이브 코딩은 코드가 깔끔해서 빚이 쌓이는 줄 모릅니다. 붙여넣기 전 자기 점검 3가지를 넣었습니다.`,`주제(학급 설문·도서 대출·동아리 대시보드·학습 계획)를 바꾸면 **예시 코드 전체가 그 주제로** 바뀝니다.`,"파이썬만 아는 학생 기준으로 줄이고 비유를 걸었습니다(`include`=`def`, `doGet`=`main()`, `google.script.run`=식당 주문)."],effect:[`문제 정의부터 회고까지 **웹앱 하나를 직접 만들어 배포**합니다.`,`AI 에게 줄 프롬프트를 설계하고, 받은 코드를 **붙이기 전에 스스로 점검**하는 습관을 익힙니다.`,`데이터 계획에서 「이 질문에 필요한 열만」 받는 **최소 수집**을 따져 봅니다.`],claude:[`목차에서 STEP 6 을 눌렀는데 **STEP 5 가 칠해지는** 버그 — 여백이 두 곳에서 더해져 182px 아래에 멈춘 것이었습니다.`,"HTML 주석 안에 템플릿 표시(`<?= ?>`)를 적으면 **웹앱 전체가 안 열립니다** — 주석까지 실행되기 때문. AI 가 준 코드의 함정으로 학생 자료에 실었습니다."],lesson:`학생에게 가르치는 「이해부채」는 교사가 AI 와 일할 때도 똑같이 쌓입니다.`,note:`앱스 스크립트 문법 수업이 아니라 「AI 와 함께 만드는 과정」을 가르치는 수업입니다. 「우리 수업에서 AI 에게 맡기면 안 되는 단계는 어디일까요?」를 선생님들께 던져 보기 좋은 쪽입니다.`},"ml-lab":{badges:[`파이썬 설치 없이 실제 학습`,`모델 10종 직접 구현`,`문제 96개 새로 씀`,`정답을 진짜 파이썬으로 확인`],shots:[{cap:`**불량 1% 데이터** — 정확도 0.98 인데 재현율 0.22 라고 앱이 먼저 경고`},{cap:`트리 깊이 20 — 훈련 R² 1.000 · 검증 0.270, 과적합 신호`},{cap:`문제 풀기 — 순서 맞추기를 맞히면 해설이 열린다`}],base:[`머신러닝 실습은 코랩·설치가 필요했고, 학생들은 코드보다 **환경에서** 막혔습니다.`,`먼저 만든 수업용 앱은 문제 은행이 **다른 분의 실습 노트북에서 온 것**이라 공개할 수 없었습니다. 직접 만든 부분(모델·화면·생성 데이터)만 옮기고 문제 96개를 **원본 없이 새로** 썼습니다.`],care:[`선형회귀부터 랜덤 포레스트·신경망까지 **모델 10종을 직접 구현**해 브라우저에서 실제로 학습합니다.`,`훈련·검증 점수를 나란히 보여 **과적합을 자동 진단**합니다. 점수가 나쁘면 앱이 먼저 까닭을 말해 줍니다.`,`문제 코드는 **진짜 파이썬으로 돌려** 정답을 확인하고, 다른 자료와 겹치지 않는지 대조하는 검사기도 둡니다.`],effect:[`전처리·모델·하이퍼파라미터를 바꿔 가며 **점수를 견주고 해석**합니다.`,`불균형 데이터에서 「정확도만 믿으면 안 된다」를 숫자로 확인합니다.`,`문제마다 「실험실에서 직접 해 보기」로 같은 데이터를 바로 열어 봅니다.`],claude:[`1회차 문제는 제가 직접 써서 본보기로 삼고, 나머지 9회차는 **도우미 다섯이 규칙 문서만 보고** 새로 썼습니다. 규칙 맨 앞에 「다른 자료의 문제를 참고하지 않는다」를 적었습니다.`,`대조 검사기에는 **옛 문제를 미끼로 넣어**, 미끼가 걸리지 않으면 검사기 고장으로 실패하게 했습니다.`,`로지스틱 회귀를 표준화 없이 냈더니 **컴퓨터마다 정답 숫자가 달라** 첫 배포에서 점검이 깨졌습니다.`],lesson:`한 번도 안 걸리는 검사기는 검사기가 아닙니다 — 미끼로 검사기를 시험합니다.`,note:`「모델을 흉내 내지 않고 실제로 학습시킨다」와 「점수가 나쁠 때 앱이 먼저 이유를 말해 준다」를 강조해 주세요. 공개용으로 문제 은행을 원본 없이 다시 쓴 이유(저작권은 만들기 전에)를 한 문장 덧붙입니다.`},"llm-rag":{badges:[`화면 30 · 문제 95`,`API 키 · 인터넷 없이`,`진짜 계산 ↔ 흉내 구분`,`외부 라이브러리 0`],shots:[{cap:`**문서 없이 물으면 지어내고(환각), 문서를 찾아 주면 근거와 함께** 답한다`},{cap:`문서를 고치면 TF·IDF 표가 바로 다시 계산된다`},{cap:`「배움 지도」 — 무엇이 진짜 계산이고 무엇이 흉내인지 표로 밝혔다`}],base:[`15주 분량의 LLM·RAG 강의 자료를 **진도 범위 참고에만** 쓰고, 텍스트 분석 → LLM → RAG → 에이전트 흐름으로 새로 짰습니다.`,`화면 문구·비유·예제·데이터·문제를 모두 새로 썼습니다(「푸른숲 도서관」 같은 이름도 지어낸 것).`],care:[`**API 키도 인터넷도 필요 없습니다** — TF-IDF·코사인·Word2Vec·Self-Attention 이 브라우저에서 실제로 계산됩니다. 모두가 요금 없이 같은 화면을 봅니다.`,`RAG 의 「답 만들기」처럼 흉내일 수밖에 없는 곳은 **노란 상자로 밝히고**, 진짜/흉내를 표로 정리했습니다.`,`「없으면 없다고 답하라」 규칙을 끄면 **지어내는 것**까지 시험으로 지킵니다.`],effect:[`LLM 이 마법이 아니라 **숫자 계산**이라는 것을 직접 돌려 보며 압니다.`,`LLM 단독 답과 RAG 답을 견주며 **환각과 근거를 구분**합니다.`,`정확도가 데이터 나누기에 따라 55~95% 로 흔들리는 것 자체를 배웁니다.`],claude:[`감성 분류 데이터를 처음엔 짝 25쌍으로 만들었더니 정확도가 **30%까지** 떨어져(모형이 외우기만 함) 다시 썼습니다.`,"화면에 `[object HTMLElement]` 가 찍혔는데 **오류가 나지 않아 조용히 배포**됐습니다. 그 뒤 이 글자를 잡아 큰 오류로 알리는 감지 장치를 넣었습니다."],lesson:`AI 수업 앱은 어디까지가 진짜인지 정직하게 밝혀야 합니다.`,note:`3번 화면의 표를 보여 주며 흉내인 곳을 숨기지 않은 이유를 말해 주세요. 1번 화면은 RAG 가 왜 필요한지 1분 안에 보여 주는 장면입니다.`},privacy:{badges:[`통신 차단(CSP)`,`비밀번호 저장 안 함`,`한영 전환까지 검사`,`[12정05-02] · [12정05-03]`],shots:[{cap:"연습 값 `tkfkdgo1234` 를 넣으면 **한글 자판 「사랑해1234」로 읽어 낸다**"},{cap:`잊힌 사이트 하나가 털리면 같은 비밀번호를 쓴 곳이 **도미노**로 뚫린다`},{cap:`운영자가 되어 가입 규칙을 바꾸면 가상 회원 100명의 결과가 달라진다`}],base:[`블로그 글 두 편(가입한 사이트 조회·탈퇴 / 안전한 비밀번호 만드는 법)을 엮어 「찾기 → 검사 → 만들기」로 짰습니다. 블로그 문장은 옮기지 않았습니다.`,`성취기준의 「**공급자 측면과 사용자 측면**」을 겨냥해 운영자 모형까지 넣었습니다.`],care:[`**비밀번호가 컴퓨터 밖으로 나가지 않게** — 배포본에 접속 차단을 넣고, 통신·저장 코드는 검사가 막습니다. 유출 확인도 오프라인 전용입니다.`,"직접 만든 검사 엔진이 흔한 비밀번호 · **한영 전환(`tkfkdgo`=사랑해)** · 자판 배열 · 날짜를 덩어리로 쪼개 추측 횟수를 셉니다.","연습용 개인정보 포털 8단계에 가짜 광고와 「뒤로 가기」 함정을 넣었습니다. 사이트 주소는 모두 `.example` 입니다.",`블로그 원문의 틀린 곳(NIST 연도 등)은 앱 안에 밝혔습니다.`],effect:[`잊힌 계정이 **왜 위험한지** 설명하고 가입한 사이트를 정리합니다.`,`비밀번호 강도를 **근거(추측 횟수·공격별 시간)로** 판단하고 만드는 방법을 고릅니다.`,`운영자가 되어 규칙을 바꿔 보며 **사용자와 공급자 양쪽**에서 봅니다.`],claude:["가상 인물 문제의 조각을 `7`·`77`처럼 짧게 넣었더니 **아무 비밀번호의 77 이 등번호로** 잡혔습니다. 배포 전 검토에서 찾아 최소 길이를 두었습니다.",`해설에 「1,024⁵ ≈ 1.1경」이라 적었는데 실제로는 **약 1,126조**였습니다. 경우의 수를 글로 쓸 때는 시험으로 확인합니다.`],lesson:`민감한 자료는 「무엇을 할지」보다 「무엇을 하지 않을지」를 먼저 정합니다.`,note:"「어디에도 보내지도 저장하지도 않는다」를 먼저 정하고 만들었다는 점을 말해 주세요. 시연은 꼭 `tkfkdgo1234` 같은 연습 값으로 합니다."},trend:{badges:[`개념 문항 37개 즉시 채점`,`캡처 그림 Ctrl+V 제출`,`시트 메뉴 10개`,`교사용 사본`],shots:[{cap:`**단위 저울** — 손잡이를 옮길 때마다 1,024배`},{cap:`초당 발생량을 정하고 쌓이는 건수를 센다 (숫자는 「우리가 정한 가정」)`},{cap:`탭② — 시각화 캡처를 끌어다 놓거나 Ctrl+V 로 붙여 올린다`}],base:[`「데이터 과학」 빅데이터 학습지(2쪽)를 탭 두 개로 옮겼습니다 — ① 개념과 특징(로그인 없이 바로 채점) ② 검색어 트렌드 분석(로그인해 제출).`,`요구는 「학생 답을 교사의 스프레드시트에서 확인」 — 그래서 **학생 1명 = 시트 1줄**로 쌓입니다.`],care:[`탭①에 문항 37개와 직접 조작하는 장치 — 단위 저울, 초당 발생 카운터, 월말 고지서 ↔ 실시간 앱 30일 시계. 틀리면 **그 칸에 정답을 적어 줍니다.**`,`시각화 캡처를 **Ctrl+V 로 바로 붙여** 올립니다. 화면에서 줄여 보내 교실 인터넷을 아끼고, **남의 그림은 보지도 지우지도 못하게** 했습니다.`,`그림 파일은 비공개라, 교사 메뉴 [🖼 고른 줄의 이미지 보기]가 실제 채점 도구가 됩니다.`,`[나가기]는 로그인과 풀이 기록을 함께 지웁니다 — 공용 PC 의 다음 학생에게 앞 학생 답이 보이지 않게.`],effect:[`빅데이터의 규모와 5V 를 외우는 대신 **감각과 사례로** 익힙니다.`,`정형·비정형을 분류하며 「왜 빅데이터는 다르게 다루는가」를 체감합니다.`,`검색어 트렌드 그래프를 근거로 **미래를 예측하는 글**을 씁니다.`],claude:[`카운터 숫자를 실제 통계처럼 보이면 안 됐습니다 — 출처 없는 수치이므로 **학생이 값을 정하고 환산만 보여 주며 「우리가 정한 가정」이라고** 밝혔습니다.`,`권한 목록을 직접 적지 않기로 했습니다. 하나만 어긋나도 「권한 부족」으로 막히고 선생님이 스스로 풀기 어렵기 때문입니다.`],lesson:`출처 없는 숫자는 사실처럼 보이지 않게 — 「가정」이라고 화면에 적습니다.`,note:`탭①은 로그인 없이 바로 써 볼 수 있어 수업 첫 5분 도입으로 좋습니다. 2번 캡처의 카운터 숫자는 가정이고, 3번 캡처의 그래프 그림은 미리보기용 예시라는 점을 밝혀 주세요.`},"data-structure":{badges:[`포트폴리오 학습지 ②~⑥`,`화면 22 · 채점 활동 31`,`답지 오류 발견`,`교사용 사본`],shots:[{cap:`**이진 탐색 트리** — 없는 값(35)은 빈 자리까지 5번 방문`},{cap:`크루스칼 — 사이클을 만드는 간선은 앱이 막고 까닭을 말한다`},{cap:`트리 용어 실험실 — 노드를 누르면 자손이 색으로 드러난다`}],base:[`「정보」 Ⅲ-1 추상화와 알고리즘 **포트폴리오 학습지 다섯 장**(2~6차시)을 직접 조작해 보는 앱으로 옮겼습니다.`,`「구글 시트로 학습 현황을 본다」가 요구라, 자동 저장할 때마다 **제출 전에도 진행률이 시트에** 쌓입니다.`],care:[`시뮬레이터·재생기 12개 — 큐, 창구 대기 간트 차트, 스택 한 걸음씩, BST 탐색, 순회 재생기, 크루스칼·프림. **그래프·트리를 라이브러리 없이** 직접 그렸습니다.`,`학습지 정답값을 시험이 전부 지킵니다 — 창구 종료 시간, BST 방문 횟수, 세 가지 순회, 최소 비용 15.`,`채점이 붙는 고르기에는 **기본 선택이 없습니다.** 점수는 화면이 보낸 만점을 믿지 않고 서버가 다시 셉니다.`],effect:[`구조의 약속(front·rear, top, 부모·자식·조상)을 **눌러 보며 눈으로 확인**합니다.`,`같은 알고리즘이 자연어 ↔ 순서도 ↔ 유사코드 ↔ 파이썬으로 어떻게 보이는지 견줍니다.`,`BST·순회·크루스칼·프림을 한 걸음씩 재생하고 직접 해 보며 **절차를 설명**합니다.`],claude:[`**학습지 답지는 20 인데, 실제 최댓값은 21** 이었습니다(자전거 도로 최장 경로). 「같은 도로 두 번 금지」만 지키면 21 이 나옵니다.`,`앱은 20 도 정답으로 받고, 21 을 찾은 학생에게 **「학습지보다 더 좋은 답」**이라고 알려 줍니다.`,"정답 비교에서 뺄셈 기호를 지웠더니 `n-1` 이 `n1` 이 되어 신장트리 정답이 통째로 틀렸던 것을 시험이 잡았습니다."],lesson:`답지도 틀릴 수 있습니다. 전부 따져 보게 하고, 더 좋은 답을 낸 학생을 알아보게 만듭니다.`,note:`「교사가 시트로 진행 상황을 본다」가 설계의 출발입니다. 답지 오류를 앱이 찾아낸 이야기는 반응이 좋은 대목입니다. 캡처의 이름은 가짜 시트의 연습 계정입니다.`},"ds-career":{badges:[`[12데과01-04]`,`구체성 검사기`,`양팔 저울 · 진로 나침반`,`교사용 사본`],shots:[{cap:`**구체성 검사기** — 누가·언제·무엇을·어떻게·어떤 데이터 뱃지 5개 (예시 입력)`},{cap:`안 켜진 뱃지에는 「왜 안 켜졌는지」가 붙는다 — 「요즘」, 「어떤 기업이」`},{cap:`양팔 저울 — 긍정만 쓰면 기울고, 네 칸을 채워야 수평`}],base:[`데이터로 달라진 세상을 **평가**하고 그 안에서 **진로를 설계**하는 수행평가 서술 여섯 항목을 위한 활동지입니다.`,`학생 서술이 「많은 기업들이…」처럼 막연해지는 것이 늘 고민이었습니다. 사례를 **「데이터로 문제를 푼 사례」**로 못 박았습니다.`],care:[`**구체성 검사기** — 쓴 사례에서 누가·언제·무엇을·어떻게·어떤 데이터를 훑어 뱃지를 켜고, **안 켜진 까닭**을 말해 줍니다. 「안 켜졌다」만 보이면 학생이 앱과 싸우게 되니까요.`,`뱃지는 채점이 아니라 **자기 점검**입니다. 최종 평가는 교사가 원문을 읽고 한다고 화면에 밝혔습니다.`,`양팔 저울은 「균형을 잡으라」고 말하는 대신 **한쪽만 쓰면 기울어 보이게** 했습니다.`,`한 차시에 열여섯 화면은 많아서, **설정 한 곳으로 열어 줄 화면을 고릅니다**(지우지 않고 잠금).`],effect:[`영향을 개인과 사회의 층위로 나눠 **균형 있게 평가**합니다.`,`보완 방법을 개인 · 기술·기업 · 사회·제도 세 주체로 생각해 「조심하자」로 끝나는 답을 넘어섭니다.`,`직업 카드·진로 나침반·역량 레이더로 **데이터 기반 진로 계획**을 씁니다.`],claude:[`[제출하기] 글씨가 **초록 배경에 초록 글씨**로 안 보였습니다 — 다른 곳의 색 규칙이 새어 든 것. 클래스 이름 충돌 검사를 넣었습니다.`,`정규식에 제어 문자를 그대로 넣었더니 시험은 통과하고 **브라우저에서만** 죽어 흰 화면이 됐습니다. 그 뒤 미리보기를 실제로 여는 것이 점검의 일부가 되었습니다.`],lesson:`시험이 다 통과해도, 실제 브라우저로 열어 봐야 합니다.`,note:`「뱃지는 채점이 아니라 자기 점검」이라는 설계 — 규칙 판정의 한계를 숨기지 않는 것 — 이 이 쪽의 핵심입니다. 캡처의 사례 글은 앱의 예시 문구이고, 2번은 일부러 막연한 표현을 넣었습니다.`},"open-data":{badges:[`[12데과02-01]`,`사이트 도감 13곳`,`죽은 링크 차단`,`교사용 사본`],shots:[{cap:`**분야 카드**를 고르면 찾을 데이터 · 검색어 · 가 볼 사이트가 뜬다`},{cap:`파일 형식을 쓰면 형태를 짐작하고, 「동적」은 함께 고른다`},{cap:`속성 표 — 정형 데이터일 때만, 열 이름·자료형을 적으면 기록장 글로`}],base:[`학습지 「스스로 수집 활동 — 공공 데이터 수집하기」와 수업 슬라이드 「공공/민간 데이터셋」에서 출발했습니다.`,`학생이 데이터를 하나 찾아 **기본 정보 여덟 가지**(분야·이름·기관·링크·이유·형태·설명·풀 문제)를 기록해 제출합니다.`],care:[`**수업 슬라이드의 링크 넷이 지금은 다른 곳**이었습니다 — 한 곳은 도메인이 넘어가 **도박 광고 사이트**가 되어 있었습니다. 학생이 그 주소를 적으면 앱이 막습니다.`,`성취기준의 태도 요소 「편향되지 않게 수집하는 자세」에 맞춰 **「빠지거나 치우친 것」 칸**을 가운데 두었습니다.`,`형태 넷은 딱 잘리지 않습니다 — API 응답은 대개 JSON(반정형)이라, 「동적」은 모양과 **함께 고르게** 했습니다.`,`점검 목록은 「채점」이 아니라 **「자기 점검」**이라 부릅니다. 우리 반 분포는 세 명보다 적으면 열리지 않습니다.`],effect:[`데이터를 찾으며 **출처·형태·이용 조건**을 확인하는 습관을 기릅니다.`,`「수집한 이유」와 「풀 수 있는 문제」를 쓰며 목적에 맞는 데이터를 고릅니다.`,`내 데이터에서 빠지거나 치우친 것을 스스로 찾아 밝힙니다.`],claude:[`**HTTP 200 이라고 그 사이트인 것은 아니었습니다** — 상태 코드로는 넷 다 「살아 있음」이었고, 페이지 제목까지 열어 봐야 알았습니다.`,`「반정형」·「비정형」이 글자 「정형」을 품고 있어, 짧은 것부터 맞추면 넷 다 정형으로 걸렸습니다. 긴 것부터 보게 고쳤습니다.`],lesson:`수업 자료의 링크도 조용히 낡습니다. 링크 점검을 자동 시험에 넣어 둡니다.`,note:`「수업 자료의 링크가 조용히 죽는다」는 사례로 쓰기 좋습니다. 200 응답이 정상이라는 뜻은 아니라는 점을 강조해 주세요. 캡처의 속성 값은 연습용 입력입니다.`},seats:{badges:[`원작 민준서 · 개작 티쳐무`,`공정성 실측(카이제곱)`,`이름·학번 받지 않음`,`교실 TV용 어두운 무대`],shots:[{cap:`**1번 학생을 1만 번 앉혀 보니 고르다** — 카이제곱·z 값으로 확인`},{cap:`5열 × 6행 교실에서 뽑은 자리표 (칠판·교탁 막대로 앞뒤를 표시)`},{cap:`공정한 무작위도 짝이 겹친다 — 피하기를 켜면 줄지만 「균등하지 않다」고 밝힌다`}],base:[`제자 **민준서 님의 자리 뽑기 웹앱**을 원저작자의 허락을 받아 다시 만들었습니다. 그래서 저작권 표시가 두 사람 이름입니다.`,`학생들이 「같은 친구랑 자꾸 짝이 돼요, 이거 공정해요?」라고 물은 것이 계기입니다.`],care:[`실측 결론은 **「원작은 치우치지 않았다」** — 순열 720가지 × 72만 회 카이제곱으로 확인했습니다.`,`그런데 학생들의 관찰도 옳았습니다 — 한 학기 10번 뽑으면 2번 이상 짝이 되는 쌍이 평균 44쌍쯤. **공정한 무작위는 원래 뭉칩니다.**`,`그래서 기본은 완전 무작위, 스위치로 「최근 짝 피하기」. 켜면 **균등한 무작위가 아니라고** 화면 세 곳에 밝혔습니다.`,"원작의 버그(문자열 비교로 `5-12` 가 빈 범위가 됨)를 고치고 회귀 시험으로 지킵니다."],effect:[`「공정하다」와 「골고루」가 다른 개념이라는 것을 **실험으로** 압니다.`,`수만 번의 시뮬레이션으로 「또 얘랑?」 같은 **직관을 데이터로 검증**합니다.`,`알고리즘을 바꾸면 무엇을 얻고 잃는지(공정함 ↔ 골고루) 견주어 판단합니다.`],claude:[`「없는 자리」 표시가 거꾸로(쓰는 자리 전부에 ❌) 나온 것은 시험이 못 잡았고, **브라우저로 직접 열어 보고서야** 발견했습니다.`,`원문자(ⓐ)를 함수 이름에 썼다가 빌드가 깨졌습니다. 한글은 되지만 원문자는 안 됩니다 — 이제 검사가 막습니다.`],lesson:`학생의 「불공정해요」를 데이터로 답하면, 그것이 곧 수업이 됩니다.`,note:`원작자 표기가 두 사람인 이유를 먼저 말해 주세요 — 만든 사람의 이름을 지우지 않는 태도입니다. 「또 여기야?는 착각이 아니라 정확한 관찰」이 하이라이트입니다. 실험 숫자는 실행할 때마다 조금씩 다릅니다.`},"major-map":{badges:[`대학알리미 공공데이터`,`408개 대학 · 학부 16,221행`,`위치 지도`,`합격 가능성은 말하지 않음`],shots:[{cap:`**컴퓨터공학과 59곳**과 같은 갈래·비슷한 이름의 학과를 한데 모은다`},{cap:`그 학과가 있는 대학을 전국 · 수도권 확대 지도에 찍는다`},{cap:`이름이 갈린 학과 880묶음 — 「어림」이라는 한계도 화면에 밝힌다`}],base:[`학생은 「컴퓨터공학과」 하나만 알고 오는데, 같은 갈래인데 **이름이 다른 학과가 205종**이나 됩니다. 이름만 보고는 갈 수 있는 길을 놓칩니다.`,`자료는 교육부 「대학알리미 키워드별 학과정보」 하나 — **공공저작물 제1유형(출처표시)**이라 공개할 수 있습니다.`],care:[`**입결·전형 자료를 한 줄도 섞지 않습니다.** 섞는 순간 공개할 수 없으므로, 합격 가능성은 한마디도 말하지 않습니다.`,`「같은 학과」를 잇는 두 방법(표준분류 · 이름 비교)을 섞지 않고, 둘 다 같다고 한 것만 「거의 확실」로 맨 위에 둡니다.`,`원자료의 어긋남(컴퓨터공학**과**와 컴퓨터공학**부**의 분류가 다름)을 몰래 고치지 않고 그대로 보여 줍니다.`,`분류 없는 1,918행(자율전공·광역모집)도 지우지 않았습니다 — 무전공이 느는 흐름에서 오히려 중요합니다.`],effect:[`학과 이름이 아니라 **배우는 내용(계열)**으로 진로를 넓혀 봅니다.`,`전국 어느 지역에 그 학과가 있는지 지도에서 확인합니다.`,`진학 정보를 읽을 때 **출처와 한계(어림)**를 구별합니다.`],claude:[`처음 쓴 지도 경계는 광역시 모양이 옛것이라 **달성군이 경북 안에** 놓였습니다. 「모든 점이 제 시·도 안에 있나」 검사가 잡아 통계청 경계로 바꿨습니다.`,`이름에서 「학」·「과」를 한 글자씩 떼었더니 「컴퓨터공학」이 「컴퓨터공」이 되어 **묶음이 달라졌습니다.** 꼬리는 덩어리로만 뗍니다.`],lesson:`「모르는 것은 말하지 않는다」를 기능으로 만들면, 공개할 수 있는 자료가 됩니다.`,note:`입시 앱이 아니라 「학과 이름의 미로」를 풀어 주는 앱입니다. 「컴퓨터공학과」를 검색해 이름이 다른 학과가 줄줄이 나오는 장면을 보여 주세요. 합격 가능성을 일부러 말하지 않는 까닭(공개할 수 있는 범위)도 함께.`},asso:{badges:[`[12데과03-04]`,`정답을 하드코딩하지 않음`,`유형별 오답 진단`,`데이터 직접 편집`],shots:[{cap:`**판매 내역 실험실** — 체크를 켜고 끄면 식·값·막대가 실시간으로`},{cap:`향상도 — 1 기준선 눈금과 정답 풀이`},{cap:`신뢰도 — A 가 든 줄만 남기면 분모가 좁아진다`}],base:[`수행평가 학습지 「연관분석 연습지」(편의점 판매 7건·품목 6개)로 **손으로 분수를 세우는 연습**을 시키려고 만들었습니다.`,`종이로는 할 수 없는 것 — 데이터를 바꿔 보기, 즉시 채점, 틀린 까닭 진단 — 을 넣었습니다.`],care:[`**정답을 하드코딩하지 않습니다.** 판매 내역에서 직접 세어 계산하므로, 학생이 품목·판매 건을 고치면 채점·힌트가 저절로 따라옵니다.`,`3/7 은 무한소수라 **소수로 비교하지 않고 분수로** 셉니다. 약분 안 한 6/14 도 정답으로 받고 「3/7」 안내를 줍니다.`,`지지도↔신뢰도 혼동, 방향 바꿈 같은 자주 하는 실수를 미리 적어 두고 **유형별 오답 진단**을 띄웁니다.`],effect:[`세 지표의 **분모가 왜 다른지**(N · n(A) · B 의 지지도) 직접 계산하며 설명합니다.`,`향상도 1 을 기준으로 「끌어당김 · 무관 · 밀어냄」을 해석합니다.`,`「함께 일어난다 ≠ 원인이다」를 화면에서 되풀이해 읽으며 연관 분석의 한계를 압니다.`],claude:[`**맞은 답에 오답 진단이 붙었습니다.** 실수 후보식이 우연히 정답과 같은 값이 된 것 — 정답이면 진단하지 않게 고쳤습니다.`,`학습지 [4]번 지문을 **글자대로 읽으면 3/4, 정답은 7/4** 였습니다. 몰래 고치지 않고 정의를 바로 아래에 덧붙였습니다.`],lesson:`AI 가 만든 채점 코드도, 내 학습지 문장도 검토하면 버그가 나옵니다.`,note:`초기에 만든 앱이라 설계 원칙(정답을 하드코딩하지 않음, 분수로 셈)이 잘 보입니다. 해시 주소가 없는 앱이라 캡처는 모두 실제로 눌러 본 화면입니다.`},diamonds:{badges:[`수행평가 형식 그대로`,`코랩과 같은 출력`,`HTML 한 파일 · 접속 차단`,`연습용 D형`],shots:[{cap:`문항 4 — 코드를 실행하면 산점도가 나온다 (코드는 캡처용 예시)`},{cap:`문항 5 — 원 그래프, 레이블과 비율까지`},{cap:"문항 2 — `df.info()` 출력이 코랩과 글자까지 같다"}],base:[`학생이 인터넷·AI 를 쓸 수 있어 **코랩으로 수행평가를 치를 수 없게** 되었습니다(2026-09).`,`그래서 문제지 + 답안지 + 데이터 + 파이썬 실행기를 **HTML 한 파일**에 담은 오프라인 시험지를 만들었고, 이것은 공개한 **연습용 D형**입니다.`,`다이아몬드 무작위 180개로 기본 정보 → 결측치 평균 대치 → 산점도·원 그래프 → 해석까지(문항 8개).`],care:[`출력을 **코랩(pandas 2.2·matplotlib 3.10)과 글자까지 같게** 맞추고, 파일 안에 접속 차단을 넣어 어디에도 접속하지 못하게 했습니다.`,`[💾 저장]은 답을 심은 HTML 을, [📤 제출]은 PDF 를 바탕 화면에 만듭니다. 다시 열면 먼저 「본인의 답이 맞나요?」를 묻습니다.`,`연습용은 **배경을 연분홍**으로, 「연습용」을 곳곳에 적어 실전용과 헷갈리지 않게 했습니다.`,`제출 전 점검은 채점이 아니라 **「빠뜨린 것」만** 알려 줍니다.`],effect:["`df.info()` → 결측치 대치 → 그래프 → 해석까지 **EDA 한 바퀴를 코드로** 해 봅니다.",`저장·제출까지 시험 형식을 미리 연습해 평가 당일 도구 실수가 줄어듭니다.`,`관점이 다른 해석 두 가지를 쓰며 코드 결과를 말로 풀어냅니다.`],claude:[`개발 서버에서는 멀쩡했는데 **빌드본만 흰 화면** — 스크립트 속 보이지 않는 제어 문자 하나 때문이었습니다. 이제 빌드가 검사합니다.`,`오류 안내가 「이렇게 쓰면 됩니다」 예시까지 보여 주는 것은 평가에 과하다는 **제 판단으로**, 고치는 코드만 빼고 까닭 설명은 남겼습니다.`],lesson:`평가 환경은 교사가 통제할 수 있어야 합니다 — 그래서 도구를 직접 만듭니다.`,note:`캡처의 코드 칸은 캡처용으로 예시 코드를 넣은 것입니다(학생은 빈칸에서 시작). 「AI 를 막으려고」보다 「평가 환경을 교사가 통제하려고」 만들었다고 말하면 와 닿습니다. 실전용 A·B·C형은 공개하지 않았습니다.`},binary:{badges:[`교안 활동 그대로`,`HTML 한 파일 · 오프라인`,`학습지 문제 1~5`,`개인정보 0`],shots:[{cap:`**숫자 카드를 뒤집어** 27 = 11011₍₂₎ — 전개식이 실시간으로`},{cap:`나눗셈 방법 — 한 줄씩 보며 나머지를 아래에서 위로 읽는다`}],base:[`제 교안 「디지털 데이터 표현 방법」의 두 풀이법 — **2로 나누기**와 **자릿값 카드 뒤집기** — 을 화면으로 옮겼습니다.`,"규칙을 바꾸기 전(「한 파일 · 인터넷 없이」 원칙 시절)에 만든 **초기 앱**이라, 지금도 `index.html` 하나로 인터넷 없이 열립니다."],care:["교안의 숫자 카드 그대로 **점이 보이는 면 = 1, 빗금 면 = 0**. 카드를 누르면 뒤집히며 `1×2⁴ + 1×2³ + …` 전개식과 합이 바로 바뀝니다.",`「카드로 만들기」는 큰 자릿값부터 뒤집으며 「27 − 16 = 11」처럼 **계산까지 말해 줍니다.**`,`나눗셈은 [다음 단계 ▶]로 한 줄씩 보이고, 마지막에 「나머지를 아래에서 위로」 결과 상자가 나옵니다.`],effect:[`10진수 → 2진수를 두 방법으로 바꾸고 **자릿값 원리로 설명**합니다.`,`「4자리 최댓값」, 「31 을 만드는 카드 수」를 카드로 확인하며 규칙을 찾습니다.`,`정답 확인·힌트·카드 시연으로 틀린 까닭을 스스로 봅니다.`],claude:["만든 뒤 **검토 관점 4개로 다시 점검**시켰더니 고칠 점 5가지가 나왔습니다 — 입력칸 예시가 정답 `0111` 을 그대로 보여 주던 것 등.","채점이 글자 완전 일치라 `01101` 이나 `1 1 0 1` 같은 정답을 오답 처리하던 것도 그때 잡았습니다."],lesson:`만든 AI 에게 「학생 입장에서 다시 검토해」라고 한 번 더 시키면, 정답 노출 같은 허점이 나옵니다.`,note:`카드 5장에서 27 을 넣고 큰 자릿값부터 뒤집히는 모습을 보여 주세요. 종이 교안 활동이 화면 애니메이션이 된다는 점이 핵심입니다. 초기 앱이라 다른 자료와 모양이 조금 다릅니다.`},"ai-textbook":{badges:[`성취기준 19개 전부`,`시뮬레이터 40여 종`,`빈칸 314 · 확인 문제 203`,`더블클릭 · 외부 의존성 0`],shots:[{cap:`**신경망이 XOR 을 실제로 학습** — 4,000 에포크, 결정 영역이 갈라진다`},{cap:`A* 길찾기 — 칸마다 g · h · f 값이 계산된다`},{cap:`목차 — 4영역 20차시 + 단원 마무리`}],base:[`「인공지능 기초」 4영역 20차시를 **성취기준 19개 전부** 다루는 웹교과서로 만들었습니다. 본문·문항·시뮬레이터는 새로 썼습니다.`,`학생이 읽기만 하지 않도록 **빈칸 채우기**와 **직접 돌려 보는 시뮬레이터**를 가운데 두었습니다.`],care:[`시뮬레이터는 미리 만든 애니메이션이 아니라 **브라우저에서 실제로 계산**합니다 — 신경망은 정말 학습하고, A* 는 정말 탐색합니다.`,"외부 자원이 하나도 없어 `index.html` 을 **더블클릭만 해도** 열립니다.",`확인 문제 203문항을 여섯 유형(객관식·O/X·순서 배열·짝 맞추기…)으로, 빈칸 314개에는 모두 힌트를 달았습니다.`,`활동 기록과 성취기준별 자가평가가 포트폴리오 쪽에 모여 인쇄됩니다(기록은 그 브라우저에만).`],effect:[`A* 에서 칸마다 계산되는 g·h·f 를 보며 BFS·DFS 와 **탐색 전략을 비교**합니다.`,`훈련·테스트 데이터로 학습과 평가를 직접 돌려 봅니다.`,`데이터 편향 실험실에서 모델을 다시 학습시키며 **AI 윤리를 근거를 갖고** 토론합니다.`],claude:[`세 웹교과서 가운데 가장 먼저 만든 것이라 **개발 기록(CLAUDE.md)이 남아 있지 않습니다.** 그래서 무엇을 겪었는지 지금 소개할 수가 없습니다.`,`대신 30쪽을 자동으로 훑는 자체 점검 쪽을 만들어 빈칸 힌트 누락·중복·외부 자원을 확인했습니다.`],lesson:`기록이 없으면 경험도 남지 않습니다 — 그 뒤의 교과서부터 규칙서와 빌드 검사를 갖췄습니다.`,note:`시뮬레이터 쪽에서 「학습 시작」을 눌러 결정 영역이 갈라지는 것을 보여 주면 「이게 진짜 계산」이라는 점이 가장 잘 전해집니다. 「기록이 없어 소개할 일화가 없다」는 것 자체가 연수의 메시지입니다.`},"ds-textbook":{badges:[`성취기준 19 / 19`,`출판사 3종 대조표`,`파이썬 브라우저 실행`,`확인 문제 76`],shots:[{cap:`빈칸 즉시 채점과 분류 활동 — 정형·비정형 나누기`},{cap:`회귀 직선 코드를 브라우저에서 바로 [실행]`},{cap:`목차 — 출판사 단원이 아니라 **성취기준 19개**로 짰다`}],base:[`「데이터 과학」 교과서는 출판사 세 곳(YBM·씨마스·천재)이고 학교마다 채택이 다릅니다. 그래서 **교과서가 아니라 성취기준 19개**를 뼈대로 새로 썼습니다.`,`출판사 자료는 단원명·쪽수만 「내 교과서에서 찾기」 대조표로 쓰고, 본문·문항·그림은 옮기지 않았습니다.`],care:["차시 주소가 곧 성취기준 코드입니다(`/lesson/03-02/`). 검사가 19개 성취기준이 모두 어느 차시에 걸리는지 셉니다.","모르는 사실은 지어내지 않고 **`[확인필요]`로 남깁니다.** 규칙서에 「그럴듯하게 채우는 것이 가장 나쁜 실패」라고 적었습니다.",`같은 데이터를 최소제곱법(한 번에)과 경사하강법(3,000번 조금씩) 두 길로 풀어 **같은 답이 나오는 것**을 직접 실행해 봅니다.`],effect:[`어느 출판사 교과서를 쓰든 「지금 배우는 것이 내 교과서 몇 쪽인지」 찾아갑니다.`,`두 가지 회귀 방법을 실행해 결과를 견주며 해석합니다.`,`차시 끝 확인 문제(즉시 채점·해설)로 성취기준 단위의 도달 여부를 스스로 점검합니다.`],claude:[`먼저 **다른 웹교과서의 결함을 조사해 목록**으로 만들고(창 크기를 바꾸면 통계가 바뀜, 정답이 빠진 퀴즈 등), 그것을 규칙과 시험으로 바꿔 같은 결함이 생기지 않게 했습니다.`,`처음 만든 「교과서 고르기」 메뉴를 「성취기준이 뼈대」라는 목적에 비추어 **스스로 걷어 냈습니다.**`],lesson:`좋은 자료를 분석할 때는 장점보다 결함 목록이 더 쓸모 있습니다 — 그대로 규칙이 됩니다.`,note:`「교과서를 옮긴 것이 아니라 성취기준에서 다시 쓴 것」이 핵심입니다. 지금은 19개 차시 모두 집필을 마치고 검토 중인 상태입니다. 03-02 쪽에서 코드를 직접 실행해 보이면 「두 방법, 같은 답」이 한눈에 보입니다.`},"pre-survey":{badges:[`첫 시간 사전 설문`,`과목 이름만 바꿔 쓰기`,`시트 메뉴 없는 가장 단순한 구조`,`교사용 사본`],shots:[{cap:`휴대폰 모양으로 그린 사전 설문지 (테스트 페이지, 보기만 함)`},{cap:`문항 6개와 제출 단추까지 — 설문지 전체`,fit:`contain`}],base:[`프로그래밍 수업 **첫 시간**에 진로 희망 · 과목 선택 이유 · 목표 · 흥미 · 탐구 주제 · 각오를 받는 설문입니다.`,`「과목 이름과 문항만 바꾸면 다른 수업에도 쓸 수 있게」 나누었습니다.`],care:[`다른 활동지와 달리 **시트 메뉴가 없는** 가장 단순한 구조라, 포털의 배포 안내를 따로 짰습니다(시트 준비 단계 없음 · 권한 승인은 배포 때).`,`과목 바꾸기는 **찾아 바꾸기(Ctrl+H) 한 번** — 두 파일 13곳의 위치까지 안내합니다.`,`문항은 두 곳(시트 머리글 · 학생 화면)에 같은 차례로 있어, 바꿀 때 함께 고치라고 적었습니다.`,`배포할 때 **유형은 반드시 「웹 앱」** — 가장 많이 틀리는 곳이라 강조 상자로 띄웁니다.`],effect:[`교사는 첫 시간에 학생의 진로·동기·흥미를 시트에서 한 번에 읽고 **수업 설계에 반영**합니다.`,`학생은 「왜 이 과목을 배우는가」와 자기 목표를 글로 정리해 봅니다.`],claude:[`이 설문지 코드는 제 구글 계정에만 있어, **붙여 준 코드만 보고 안내를 썼습니다.** 코드가 바뀌면 안내도 함께 고쳐야 한다고 기록에 남겼습니다.`,`안내 그림 제목에 「프로그래밍**를**」 같은 조사 오류가 있었습니다 — **과목 이름처럼 바뀌는 값 뒤에는 조사를 붙이지 않습니다.**`],lesson:`안내문은 코드와 어긋나는 순간 해가 됩니다. 「무엇을 보고 썼는지」를 기록해 둡니다.`,note:`「과목 이름만 바꾸면 우리 수업 설문지가 된다」를 강조해 주세요. 캡처는 테스트 페이지를 보기만 했고 아무것도 입력·제출하지 않았습니다.`},"sw-idea":{badges:[`구글 시트로 제출`,`쓰던 곳부터 이어 쓰기`,`비밀번호는 해시로만`,`교사용 사본`],shots:[{cap:`항목마다 💡 도움말 · 글자 수 · 진행률을 보며 쓴다 (미리보기 모드)`},{cap:`이름 입력과 아이디어 유형 카드 4택 1`},{cap:"다시 온 학생에게 이름을 가려(`홍○동`) 보여 주는 본인 확인"}],base:[`종이 활동지 「SW 개발 아이디어 제안하기」(제안 배경 → 세부 내용 → 기대 효과)를 웹으로 옮겼습니다.`,`구글 폼을 쓰지 않은 까닭 — 항목마다 **작성 도움말과 글자 수 안내**를 붙이고, **여러 차시에 걸쳐 이어 쓰게** 하려면 중간 저장이 꼭 필요했습니다.`,`여섯 활동지 가운데 가장 먼저 만들었고, 나머지의 로그인·저장·시트 틀이 여기서 나왔습니다.`],care:[`**두 겹 저장** — 이 컴퓨터에 즉시, 서버에는 1분 30초마다 **바뀐 학생만**. 글자마다 보내면 서른 명 수업에서 버티지 못합니다.`,"비밀번호 원문은 저장하지 않고(해시), 이미 있는 학번에는 이름을 `홍○동` 처럼 가려 보여 줍니다.",`틀린 비밀번호는 0.7초 늦출 뿐 **잠그지 않습니다** — 잠그면 정작 잊은 학생이 수업 중에 못 들어오니까요.`,`제출은 같은 학번이면 그 줄을 덮어쓰고, 「제출 기록(백업)」 시트에는 매번 한 줄을 남깁니다.`],effect:[`아이디어를 「왜 필요한가 → 무엇을 만들까 → 어떤 효과」 순서로 **구체화해 제안**합니다.`,`「누가·언제·무엇 때문에」 같은 도움말 요령으로 막연한 말 대신 장면과 숫자로 씁니다.`,`교사는 시트 한 장으로 학급 전체의 아이디어를 보고, 마감·비밀번호 초기화를 시트 메뉴로 합니다.`],claude:[`새로 고침하면 브라우저가 입력칸을 되살리며 알림을 보내, **아무것도 안 썼는데 「저장 안 된 내용이 있다」**고 잘못 알렸습니다. 내용을 직접 비교하도록 고쳤습니다.`,`배포용 원본에 시험 흔적(「제출 현황」 탭)이 생긴 것을 보고, **원본에서는 시험 로그인도 하지 않는다**는 규칙이 굳었습니다.`],lesson:`가짜 시트로 시험은 다 했어도 「실제 구글 계정에 올려 본 것은 아니다」를 기록에 정직하게 남깁니다.`,note:`「구글 폼이 아니라 직접 만든 까닭」(이어 쓰기 · 도움말)을 말해 주세요. 캡처의 노란 「미리보기 모드」 띠는 배포 전 확인용 화면이라 나온 것입니다. 교사가 시트에서 보는 부분은 말로 설명합니다.`},oop:{badges:[`[12정03-08]`,`직접 만든 파이썬 해석기`,`평가요소 7가지 자동 확인`,`한 파일 · 오프라인`],shots:[{cap:`**칸을 채우면 코드가 실시간으로 조립**되고 평가요소 7/7 이 확인된다`},{cap:"비공개 속성을 밖에서 꺼내면 `AttributeError` — 이름 맹글링까지 재현"},{cap:`교안 예제 실행 — 평가요소를 ☑/☐ 로 (Circle 은 오류 찾기)`}],base:[`제 객체 지향 교안(34쪽)과 수행평가 설계지에서 출발했습니다. 수행평가는 컴퓨터실 IDLE 에서 **30분 동안 직접 타이핑**하고 평가요소가 7가지입니다.`,`앱은 2차시에 설계지 다섯 칸을 채우는 **준비 도구**입니다. 3차시 실전은 앱 없이 손으로 칩니다.`],care:["교실 인터넷이 끊겨도 돌도록 **파이썬 해석기를 직접 만들었습니다.** 이름 맹글링까지 재현해, 밖에서 `myCar.__speed` 를 부르면 진짜처럼 AttributeError 가 납니다.",`평가요소 확인은 글자 맞추기가 아니라 **코드 구조를 읽습니다.** 손으로 고친 코드도 채점되고, 점수엔 「예상 점수(참고용)」라고 붙입니다.`,`클래스 예시를 골라도 **이름만 채워집니다** — 속성까지 채워 주면 평가요소를 앱이 대신 채우는 셈이니까요.`,"교안 자체의 오류(`return area` 누락)를 「오류 찾기」 문제로 썼습니다."],effect:[`클래스 이름 · 비공개 속성 · 접근자 · 설정자 · 메소드 · 객체 생성 · 호출 **7요소를 설계하고 코드로 확인**합니다.`,`비공개 속성은 밖에서 못 꺼내고 공개 속성엔 −999 가 그대로 들어가는 것을 보며 **정보 은닉이 왜 필요한지** 실험합니다.`,`「설계 → 코드 → 평가요소」를 한 화면에서 오가며 부족한 곳을 스스로 찾습니다.`],claude:[`지원하지 않는 문법(상속 등)을 **조용히 무시했더니** 엉뚱한 오류 안내가 나와 학생이 원인을 못 찾았습니다. 이제 이름을 대어 「지원하지 않습니다」라고 말합니다.`,`공개 전에 **다섯 관점으로 훑고 지적마다 반박 검증**을 했더니, 안전장치가 정작 필요한 순간에 돌지 않는다는 것이 드러났습니다.`],lesson:`못 하는 것은 조용히 넘기지 말고 「못 한다」고 말하게 만듭니다.`,note:`「학생이 코드를 쓰는 연습」이 아니라 「설계 → 코드 → 평가요소」를 한 화면에서 오가게 한 점이 핵심입니다. 2번 화면의 AttributeError 장면이 가장 눈에 띕니다. 여기서 만든 파이썬 해석기를 정보노트·LLM 실습실도 가져다 씁니다.`},"offline-exam":{badges:[`[데이터 준비와 분석] 20점`,`인터넷·AI 차단(접속 막음)`,`실전 A·B·C형 + 연습 D형`,`저장·제출 = 파일만`],shots:[{cap:`**평가 당일 A형 시험지** — 실제로 쓴 판을 연습용 이름(10101 연습생)으로 연 화면`,addr:`바탕 화면 › A형_자동차연비.html  (오프라인 · 인터넷 없음)`},{cap:`🔍 점검하기 — 채점이 아니라 **빠뜨린 것만** 알려 준다`,addr:`바탕 화면 › A형_자동차연비.html  (오프라인 · 인터넷 없음)`},{cap:`다시 열면 먼저 묻는다 — 「본인의 답이 맞나요?」 (이름 가운데는 가림)`,addr:`바탕 화면 › A형_10101_연습생.html  (저장한 답 파일)`},{cap:`[📤 제출하기]로 만든 PDF 세 쪽 — 라이브러리 없이 직접 조립 (연습용 D형 · 예시 답)`,addr:`바탕 화면 › D형_10101_연습생.pdf  (제출 파일)`}],base:[`학생들이 인터넷과 생성형 AI 를 쓸 수 있어, 계획했던 **코랩 수행평가가 공정하지 않게** 되었습니다.`,`그래서 문제지 · 답안지 · 데이터 · **파이썬 실행기**를 HTML 한 파일에 담았습니다. 인터넷 없이 열리고, 파일은 어디에도 접속하지 못합니다.`,`1학년 「데이터 과학」 **[데이터 준비와 분석]** 20점(학기말 20%) — 실전 문형 A·B·C + 연습용 D형.`],care:[`출력을 **코랩과 글자까지 같게** — 진짜 pandas·matplotlib 셀 852개와 대조했습니다. 연습한 환경과 시험 환경이 달라 당황하지 않게.`,`[💾 저장]은 답을 심은 HTML 을, [📤 제출]은 PDF 를 바탕 화면에 만듭니다. **서버도 계정도 없이 파일만으로** 걷습니다.`,`다시 열면 먼저 **「본인의 답이 맞나요?」** — 같은 PC 를 다음 반이 쓸 때 앞 학생의 답이 뜨지 않게.`,`오류 안내에서 **「이렇게 고치세요」 예시는 뺐습니다** — 까닭 설명은 남기되 답을 알려 주지 않게(교사 판단).`],effect:[`생성형 AI 없이 **자기 손으로** EDA 한 바퀴(파악 → 결측 처리 → 시각화 → 해석)를 해냈는지 확인합니다.`,`연습 시간에 같은 틀(D형)로 미리 해 보아, 평가 당일에는 **도구가 아니라 내용**에 집중합니다.`,`모든 학생이 같은 엔진 · 같은 시간 · 같은 점검으로 치러 **평가의 공정성**을 지킵니다.`],claude:[`검증 도우미가 **지난 시간 답 파일을 덮어쓰는 사고**를 미리 찾았습니다 — 다음 시간에 원래 시험지를 잘못 열고 같은 이름으로 저장하면 앞 답이 사라질 수 있었습니다. 저장 안내를 둘로 나눠 막았습니다.`,"학생 답 **502가지 변형**을 엔진과 진짜 파이썬 양쪽으로 돌려 대조해, 숫자 열의 `value_counts()` 가 한 줄로 뭉치는 결함 등 11건을 평가 전에 고쳤습니다."],lesson:`평가 도구는 「학생이 실수할 수 있는 모든 길」을 먼저 걸어 봐야 합니다 — 그 일을 AI 도우미에게 맡겼습니다.`,note:`포털에 없는 자료입니다(실전 문항과 데이터가 들어 있어 공개하지 않음). QR 은 같은 틀의 연습용 D형으로 갑니다. 화면은 실제로 쓴 판(v1012)을 연습용 이름으로 연 것이고, 제출 PDF 는 연습용 D형에 예시 답을 넣어 만든 것입니다.`}},f={title:`활동지를 나누는 방법 — 교사용 사본`,sub:`학생 답은 선생님 시트에만 쌓입니다`,shots:[{cap:`포털의 「교사용 사본」 안내 화면 — 그림과 단계 체크로 배포까지 따라 합니다`}],steps:[{t:`사본 만들기`,d:`포털 카드의 **[🧑‍🏫 교사용 사본 만들기]** — 구글 사본 화면은 새 탭에, 지금 탭은 배포 안내로 넘어갑니다. 시트에 붙은 앱스 스크립트도 함께 복사됩니다.`},{t:`시트 준비 · 권한 승인`,d:`사본 시트 메뉴 줄 끝의 앱 메뉴 → **「시트 준비하기」**. 「확인하지 않은 앱」 경고가 뜨면 고급 → 이동 → 권한을 **모두 선택**하고 계속.`},{t:`웹 앱 배포`,d:`배포 › 새 배포 › 웹 앱. 실행은 **「나」**, 액세스는 **「모든 사용자」**. 나온 주소를 학생에게 알려 주면 끝입니다(5분이면 됩니다).`}],why:`<b>왜 사본인가요?</b> 제 웹앱 하나에 여러 학교 시트를 붙이면 다른 학교 학생 정보가 제 계정을 거치고, 동시 실행 한도도 나눠 써야 합니다. 그래서 각 선생님이 사본을 만들어 <b>자기 드라이브에서</b> 쓰게 했습니다. ⚠ 나누는 원본에는 학생 데이터가 없어야 합니다 — 숨긴 「계정(비밀번호)」 시트까지 함께 복사되기 때문입니다.`},p=[{id:`ds-textbook`,area:`textbook`,icon:`📊`,title:`데이터 과학 웹교과서`,sub:`데이터 과학 과목을 위한 온라인 교과서`,url:`https://trmoo.github.io/22hs-ds/`},{id:`ai-textbook`,area:`textbook`,icon:`🤖`,title:`인공지능 기초 웹교과서`,sub:`인공지능 기초 과목을 위한 온라인 교과서`,url:`https://trmoo.github.io/22hs-ai/`},{id:`prog-textbook`,area:`textbook`,icon:`💻`,title:`프로그래밍 웹교과서`,sub:`프로그래밍 과목을 위한 온라인 교과서`,url:`https://trmoo.github.io/22hs-programming/`},{id:`info-note`,area:`note`,icon:`📝`,title:`티쳐무의 정보노트 실습실`,sub:`정보 과목 학습 노트와 실습 공간`,url:`https://trmoo.github.io/informatics_trmoo/`},{id:`ai-note`,area:`note`,icon:`🧠`,title:`티쳐무의 인공지능 기초 노트`,sub:`인공지능 기초 학습 노트`,url:`https://trmoo.github.io/aiBasics_trmoo/`},{id:`commeng`,area
